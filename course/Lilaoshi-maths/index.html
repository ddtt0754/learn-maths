      '<span class="play">▶</span>' +
      (pf ? '<a class="practice" href="' + pf + '" onclick="event.stopPropagation();">📝 练习</a>' : '');
    b.addEventListener('click', ()=>{
      player.pause();
      player.src = vUrl(name, f);
      playerTitle.textContent = showName(f);
      mask.classList.add('open');
      player.load();
      player.play().catch(()=>{});
    });
    listEl.appendChild(b);
  });
}
document.getElementById('playerClose').addEventListener('click', ()=>{ mask.classList.remove('open'); player.pause(); });
mask.addEventListener('click', (e)=>{ if(e.target === mask){ mask.classList.remove('open'); player.pause(); } });

renderTabs();
renderList();
</script>
</body>
</html>
