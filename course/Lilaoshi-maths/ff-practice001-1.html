<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2ebd85">
<title>四阶 计算专题 · 练习（建设中）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#eefaf4 0%,#eef4fb 100%);color:#33434b;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:28px 16px calc(60px + env(safe-area-inset-bottom))}
  .app{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center}
  .hero{position:relative;width:100%;background:linear-gradient(135deg,#35d29a 0%,#2f9df0 100%);border-radius:22px;padding:28px 20px 24px;text-align:center;color:#fff;overflow:hidden;box-shadow:0 14px 30px rgba(47,157,240,.25)}
  .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
  .hero::before{width:110px;height:110px;top:-36px;right:-28px}
  .hero::after{width:64px;height:64px;bottom:-22px;left:-14px}
  .hero .tag{position:relative;display:inline-block;background:rgba(255,255,255,.22);border-radius:20px;padding:3px 14px;font-size:12px;letter-spacing:2px;backdrop-filter:blur(4px)}
  .hero h1{position:relative;font-size:22px;letter-spacing:1px;font-weight:800;margin-top:10px;text-shadow:0 2px 6px rgba(0,0,0,.12)}
  .hero .sub{position:relative;margin-top:6px;font-size:11.5px;letter-spacing:3px;opacity:.92}
  .banner{width:100%;text-align:center;background:#fff;border-radius:16px;padding:36px 20px;margin-top:16px;box-shadow:0 4px 14px rgba(47,157,240,.09)}
  .banner .ico{font-size:44px}
  .banner .t{font-size:16px;font-weight:800;color:#1f2d3d;margin-top:12px}
  .banner .d{font-size:13px;color:#8aa09a;margin-top:8px;line-height:1.8}
  .btn-row{display:flex;gap:10px;margin-top:18px;width:100%}
  .link-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 10px;background:#fff;color:#1fa873;border:1.5px solid #2ebd85;border-radius:999px;font-size:14px;font-weight:700;text-decoration:none;box-shadow:0 4px 12px rgba(46,158,107,.12);transition:transform .15s;touch-action:manipulation}
  .link-btn:active{transform:scale(.95)}
  footer{width:100%;margin-top:18px;text-align:center;font-size:12px;color:#a8bcb4;letter-spacing:1px}
  .coach-tip{position:relative;display:inline-block;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .coach-tip .tip{visibility:hidden;opacity:0;position:absolute;bottom:145%;left:50%;transform:translateX(-50%) translateY(4px);background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;padding:7px 14px;border-radius:10px;font-size:12.5px;font-weight:700;white-space:nowrap;letter-spacing:.5px;z-index:99;pointer-events:none;box-shadow:0 6px 18px rgba(47,157,240,.35);transition:opacity .2s ease,transform .2s ease,visibility .2s}
  .coach-tip .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#2f9df0}
  .coach-tip:hover .tip,.coach-tip:active .tip,.coach-tip:focus .tip{visibility:visible;opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <span class="tag">四阶数学思维课 · 练习</span>
    <h1>计算专题 · 12种简便运算技巧</h1>
    <div class="sub">内容建设中 · 敬请期待</div>
  </header>

  <div class="banner">
    <div class="ico">🏗️</div>
    <div class="t">练习内容建设中</div>
    <div class="d">本节练习页正在筹备中<br>请先观看视频课程学习</div>
  </div>

  <div class="btn-row">
    <a class="link-btn" href="index.html">🎬 返回课程</a>
  </div>
  <footer>© 2026 <span class="coach-tip" tabindex="0">两英豆豆教练<span class="tip">微信号 ddtt0754</span></span></footer>
</div>
</body>
</html>
