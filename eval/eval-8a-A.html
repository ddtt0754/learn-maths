<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12b39a">
<title>八年级上册数学 · 期末测试A卷（互动版）｜豆豆智学</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#eef7f5; --card:#ffffff; --text:#10312c; --text2:#5c7b75; --text3:#8aa5a0;
    --primary:#12b39a; --primary-d:#0b947f; --primary-l:#e4f7f2; --primary-m:#a9e5d8;
    --orange:#ff9f45; --orange-d:#e8862b; --orange-l:#fff4e6;
    --line:#d9ebe6; --shadow:0 6px 20px rgba(18,179,154,.10);
    --r:16px; --grad:linear-gradient(135deg,#38d7b8,#14a9b8);
  }
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-size:15px; line-height:1.65;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%; overflow-x:hidden;
  }
  h1,h2,h3,p,ul,ol{margin:0}
  ul,ol{padding-left:1.15em}

  /* ---------- 顶部 ---------- */
  .hero{background:var(--grad);color:#fff;padding:22px 0 26px;border-radius:0 0 24px 24px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-46px;top:-56px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.14)}
  .hero::before{content:"";position:absolute;left:-40px;bottom:-70px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.10)}
  .hero-in{max-width:760px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
  .kicker{display:inline-block;font-size:12px;letter-spacing:.06em;background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.42);padding:3px 10px;border-radius:999px}
  .hero h1{font-size:21px;line-height:1.4;margin:10px 0 6px;font-weight:800}
  .hero .sub{font-size:13px;opacity:.94}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{font-size:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.34);padding:3px 9px;border-radius:999px;white-space:nowrap}
  .chip b{font-weight:800}

  /* ---------- 主体 ---------- */
  .wrap{max-width:760px;margin:0 auto;padding:0 14px calc(var(--barh,190px) + 22px)}
  .notice{background:#fff;border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:12px;padding:10px 12px;margin:14px 0 0;font-size:13px;color:var(--text2)}
  .notice b{color:var(--orange-d)}

  .group{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .ghead{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;background:linear-gradient(135deg,#f2fbf8,#eaf7f4);border-bottom:1px solid var(--line)}
  .gidx{flex:0 0 auto;width:26px;height:26px;border-radius:9px;background:var(--primary);color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .gtitle{flex:1 1 auto;min-width:0}
  .gtitle h2{font-size:15px;font-weight:800;line-height:1.45}
  .gtitle p{font-size:12px;color:var(--text3);line-height:1.5;margin-top:1px}
  .gcount{flex:0 0 auto;font-size:12px;color:var(--primary-d);background:#fff;border:1px solid var(--primary-m);padding:2px 8px;border-radius:999px;white-space:nowrap}

  /* ---------- 题目 ---------- */
  .qcard{padding:14px;border-top:1px dashed var(--line)}
  .qcard:first-of-type{border-top:0}
  .qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .pick{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-10px 0 -10px -10px;cursor:pointer}
  .pick input{position:absolute;opacity:0;width:1px;height:1px}
  .pbox{width:20px;height:20px;border-radius:6px;border:2px solid #b9d8d2;background:#fff;display:inline-block;position:relative;transition:.15s}
  .pick input:checked + .pbox{background:var(--orange);border-color:var(--orange)}
  .pick input:checked + .pbox::after{content:"";position:absolute;left:5px;top:1px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
  .pick input:focus-visible + .pbox{outline:2px solid var(--primary);outline-offset:2px}
  .qno{font-size:13px;font-weight:800;color:#fff;background:var(--primary);border-radius:8px;padding:1px 8px;min-width:30px;text-align:center}
  .tag{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
  .tag.d1{color:#0b7a68;background:#e2f6f0;border-color:#b9e8dc}
  .tag.d2{color:#0d7f96;background:#e3f4f9;border-color:#b6e2ee}
  .tag.d3{color:#a15b12;background:var(--orange-l);border-color:#f7d4aa}
  .stem{font-size:15.5px;line-height:1.75;word-break:break-word}
  .stem .kw{font-weight:800;color:var(--primary-d)}
  .stem .em{font-weight:800;color:var(--orange-d)}

  .opts{display:grid;gap:8px;margin-top:10px}
  .opt{display:flex;align-items:center;gap:9px;min-height:44px;padding:9px 11px;border:1.5px solid var(--line);border-radius:12px;background:#fcfefd;cursor:pointer;transition:.14s;word-break:break-word}
  .opt input{position:absolute;opacity:0;width:1px;height:1px}
  .odot{flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:2px solid #b9d8d2;background:#fff;position:relative;transition:.14s}
  .okey{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--text3);width:14px}
  .otext{flex:1 1 auto;min-width:0;font-size:14.5px;line-height:1.55}
  .opt.sel{border-color:var(--primary);background:var(--primary-l)}
  .opt.sel .odot{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 3px #fff}
  .opt.sel .okey{color:var(--primary-d)}
  .opt.right{border-color:var(--primary);background:#e9faf4}
  .opt.right::after{content:"✓ 正确";font-size:11.5px;font-weight:800;color:var(--primary-d);white-space:nowrap}
  .opt.wrong{border-color:var(--orange);background:var(--orange-l)}
  .opt.wrong::after{content:"✕ 你选的";font-size:11.5px;font-weight:800;color:var(--orange-d);white-space:nowrap}

  .fillrow{margin-top:10px}
  .fill{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14.5px;color:var(--text2)}
  .finput{width:104px;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px;font-weight:700;color:var(--text);background:#fcfefd;font-family:inherit}
  .finput:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(18,179,154,.15)}
  .finput:disabled{background:#f4f8f7;color:var(--text2)}
  .unit{font-size:14px;color:var(--text2)}

  .fb{margin-top:10px;border-radius:12px;padding:10px 11px;font-size:13.5px;line-height:1.7;border:1px solid}
  .fb.ok{background:#f0fbf7;border-color:#c6ecdf}
  .fb.no{background:#fff8f0;border-color:#f6ddc0}
  .fbrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
  .verdict{font-size:12.5px;padding:1px 9px;border-radius:999px;color:#fff}
  .fb.ok .verdict{background:var(--primary)}
  .fb.no .verdict{background:var(--orange)}
  .you{color:var(--text2);font-weight:600}
  .ansline{color:var(--primary-d)}
  .ansline b{font-weight:800}
  .explain{margin-top:5px;color:var(--text2)}
  .explain b{color:var(--text)}
  .cause{margin-top:5px;font-size:12.5px;color:var(--orange-d);background:#fff;border:1px dashed #f0cfaa;border-radius:9px;padding:4px 8px;display:inline-block}

  /* ---------- 底部操作条 ---------- */
  .actionbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(16,49,44,.08);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
  .ab-in{max-width:760px;margin:0 auto}
  .ab-stat{font-size:12px;color:var(--text2);margin-bottom:4px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .ab-stat b{color:var(--primary-d);font-size:13.5px}
  .ab-stat .dot{color:var(--text3)}
  .ab-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #btnSubmit{grid-column:span 2}
  #btnPrint{grid-column:span 2;font-size:14px}
  .btn{min-height:44px;min-width:44px;padding:9px 14px;border-radius:999px;border:1.5px solid transparent;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;line-height:1.3}
  .btn-main{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(18,179,154,.28)}
  .btn-line{background:#fff;color:var(--primary-d);border-color:var(--primary-m)}
  .btn-ghost{background:var(--primary-l);color:var(--primary-d);border-color:#c9ece2}
  .btn-warm{background:var(--orange);color:#fff;box-shadow:0 4px 12px rgba(255,159,69,.30)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
  .btn:focus-visible{outline:2px solid var(--primary-d);outline-offset:2px}

  /* ---------- 报告 ---------- */
  .report{margin-top:20px}
  .rhead{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
  .rhead h2{font-size:17px;font-weight:800}
  .rhead .line{flex:1 1 auto;height:1px;background:var(--line)}
  .rcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .rcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
  .rcard.main{grid-column:span 3;background:var(--grad);color:#fff;border-color:transparent}
  .rlabel{display:block;font-size:12px;color:var(--text3);letter-spacing:.04em}
  .rcard.main .rlabel{color:rgba(255,255,255,.86)}
  .rnum{display:block;font-size:21px;font-weight:800;line-height:1.25;margin-top:2px;white-space:nowrap}
  .rcard.main .rnum{font-size:30px}
  .rsub{display:block;font-size:12px;color:var(--text2);margin-top:2px}
  .rcard.main .rsub{color:rgba(255,255,255,.9)}
  .dbar{height:7px;border-radius:999px;background:#e9f2f0;overflow:hidden;margin-top:8px}
  .dbar i{display:block;height:100%;border-radius:999px;background:var(--primary)}
  .dbar i.warn{background:var(--orange)}

  .rblock{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
  .rblock h3{font-size:15px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .rblock h3 span.n{width:20px;height:20px;border-radius:7px;background:var(--primary-l);color:var(--primary-d);font-size:11.5px;display:flex;align-items:center;justify-content:center;font-weight:800}
  .mrow{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:13.5px}
  .mrow:first-of-type{border-top:0}
  .mcode{flex:0 0 auto;font-weight:800;color:var(--orange-d);background:var(--orange-l);border:1px solid #f6ddc0;border-radius:7px;padding:0 7px;font-size:12.5px;line-height:22px;height:22px}
  .mbody{flex:1 1 auto;min-width:0}
  .mbody .mt{display:block;font-weight:700;line-height:1.45}
  .mbody .ms{display:block;color:var(--text2);font-size:12.5px;line-height:1.55}
  .mcount{flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--text2)}
  .kwlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .kwbtn{min-height:36px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--primary-m);background:#fff;color:var(--primary-d);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}

  .grow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px dashed var(--line);font-size:13.5px}
  .grow:first-of-type{border-top:0}
  .gname{flex:1 1 auto;min-width:0;font-weight:700;word-break:break-word}
  .gname em{display:block;font-style:normal;font-size:12px;color:var(--text3);font-weight:400}
  .st{flex:0 0 auto;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:999px;white-space:nowrap}
  .st.no{color:#a15b12;background:var(--orange-l);border:1px solid #f6ddc0}
  .st.mid{color:#0d7f96;background:#e3f4f9;border:1px solid #b6e2ee}
  .st.ok{color:#0b7a68;background:#e2f6f0;border:1px solid #b9e8dc}
  .advice{font-size:13.5px;line-height:1.8;color:var(--text2)}
  .advice li{margin-bottom:6px}
  .advice b{color:var(--text)}
  .foot{margin:16px 0 0;text-align:center;font-size:12px;color:var(--text3);line-height:1.7}
  .coach-tip{display:inline-block;padding:4px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--text2);cursor:pointer;user-select:none;min-height:32px}
  .coach-tip .wx{display:none;color:var(--primary-d);font-weight:800}
  .coach-tip.show .wx{display:inline}

  /* ---------- 提示 / 错误 ---------- */
  #toast{position:fixed;left:50%;bottom:calc(var(--barh,190px) + 14px + env(safe-area-inset-bottom));transform:translate(-50%,10px);z-index:60;max-width:min(90vw,420px);background:#10312c;color:#fff;font-size:13.5px;line-height:1.5;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.24)}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #errBanner{position:fixed;left:8px;right:8px;top:8px;z-index:70;background:#4a2a10;color:#ffe9d2;font-size:13px;line-height:1.6;padding:10px 12px;border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.25)}
  #errBanner[hidden]{display:none}

  /* ---------- 打印区（屏幕上隐藏） ---------- */
  #printArea{display:none}

  @media (max-width:380px){
    .hero h1{font-size:19px}
    .stem{font-size:15px}
    .otext{font-size:14px}
    .btn{font-size:14px;padding:9px 10px}
    #btnPrint{font-size:13px}
    .gtitle h2{font-size:14px}
  }
  @media (min-width:620px){
    .ab-grid{grid-template-columns:auto auto auto 1fr}
    #btnSubmit,#btnPrint{grid-column:auto}
    #btnPrint{justify-self:end}
    .rcards{grid-template-columns:repeat(4,1fr)}
    .rcard.main{grid-column:span 1}
    .rcard.main .rnum{font-size:32px}
    .rnum{font-size:24px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }

  /* ---------- 打印样式：A4 单栏，题目不断页 ---------- */
  @media print{
    @page{size:A4;margin:13mm 11mm 14mm}
    html,body{background:#fff!important;color:#000!important}
    .hero,.wrap,.actionbar,#toast,#errBanner{display:none!important}
    #printArea{display:block!important;max-width:none;margin:0;padding:0;color:#000;font-size:11.5pt;line-height:1.6;
      font-family:"PingFang SC","Microsoft YaHei","Songti SC",serif}
    .phead{text-align:center;border-bottom:2px solid #000;padding-bottom:6pt;margin-bottom:10pt}
    .phead h1{font-size:15pt;font-weight:800;letter-spacing:.02em}
    .psub{font-size:10.5pt;margin-top:2pt}
    .pinfo{font-size:9.5pt;margin-top:5pt;display:flex;flex-wrap:wrap;gap:4pt 14pt;justify-content:center}
    .pq{break-inside:avoid;page-break-inside:avoid;border:1px solid #999;border-radius:4pt;padding:7pt 9pt;margin:0 0 9pt}
    .pqhead{font-size:9.5pt;color:#333;margin-bottom:3pt}
    .pqstem{font-size:11.5pt;line-height:1.62;margin-bottom:4pt}
    .pqline{font-size:10.5pt;line-height:1.6;margin-top:2pt}
    .pqline .lb{font-weight:800}
    .pqline .bad{font-weight:800;text-decoration:underline}
    .pqline .good{font-weight:800;border-bottom:1px solid #000}
    .pfoot{margin-top:8pt;font-size:9pt;text-align:center;color:#444;border-top:1px solid #bbb;padding-top:5pt}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <span class="kicker">豆豆智学 · 数学分层测评</span>
    <h1>八年级上册数学 · 期末测试 A 卷</h1>
    <p class="sub">人教版新课标 · 学期知识点全覆盖 · 低中高难度混合测评</p>
    <div class="chips">
      <span class="chip">学习者：<b>测试学员</b></span>
      <span class="chip">共 <b>30</b> 题</span>
      <span class="chip">低 <b>10</b> · 中 <b>15</b> · 高 <b>5</b></span>
      <span class="chip">提交后出报告</span>
    </div>
  </div>
</header>

<div class="wrap">
  <p class="notice">作答说明：共 <b>30</b> 题、<b>9</b> 个知识点分组。选择题点选一项，填空题填数字（单位已给出）。全部做完后点底部「<b>提交判分</b>」查看逐题对错与解析；答错或未作答的题可勾选后点「<b>打印选中错题（另存 PDF）</b>」。</p>
  <main id="quizArea" aria-live="polite"></main>
  <section id="reportArea" class="report" hidden></section>
  <p class="foot">
    <span class="coach-tip" id="coachTip" role="button" tabindex="0">© 两英豆豆教练</span>
  </p>
</div>

<div class="actionbar" id="actionbar">
  <div class="ab-in">
    <div class="ab-stat"><span>已答 <b id="statAns">0</b>/30</span><span class="dot">·</span><span>已勾选 <b id="statPick">0</b></span><span class="dot">·</span><span id="statHint">未提交</span></div>
    <div class="ab-grid">
      <button type="button" class="btn btn-main" id="btnSubmit" data-act="submit">提交判分</button>
      <button type="button" class="btn btn-line" id="btnReset" data-act="reset">重新作答</button>
      <button type="button" class="btn btn-ghost" id="btnPick" data-act="pickwrong">勾选全部错题</button>
      <button type="button" class="btn btn-warm" id="btnPrint" data-act="print">打印选中错题（另存 PDF）</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="errBanner" hidden role="alert"></div>
<div id="printArea"></div>

<script>
(function(){
  'use strict';

  /* ============================================================
     1. 基础数据
     ============================================================ */
  var TITLE = '八年级上册数学 · 期末测试 A 卷';
  var STUDENT = '测试学员';
  var TOTAL = 30;

  /* 答案与解析以 Base64 形式存放，页面源码中不出现明文答案；
     提交时才解码（前端无法做真正的加密，仅避免肉眼直读源码泄露答案）。 */

  /* 答案归一化：全角转半角、去空格与单位/标点，便于判分 */
  function normAns(s){
    var t = String(s == null ? '' : s);
    t = t.replace(/[\uFF01-\uFF5E]/g, function(ch){
      return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
    });
    t = t.replace(/\u3000/g, ' ');
    t = t.replace(/\s+/g, '');
    t = t.replace(/[，,。.、；;：:（）()【】「」"'"'？?！!]/g, '');
    t = t.replace(/(厘米|分米|毫米|米|分钟|小时|个|元|角|分|页|人|本|张|只|条|时|盒|组|天)/g, '');
    return t.toLowerCase();
  }

  function decodeKey(){
    if(KEY_CACHE) return KEY_CACHE;
    if(!KEY_B64 || KEY_B64.indexOf('__KEY') === 0){ throw new Error('答案数据未注入，无法判分'); }
    var bin = atob(KEY_B64);
    var bytes = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++){ bytes[i] = bin.charCodeAt(i); }
    var txt;
    if(window.TextDecoder){
      txt = new TextDecoder('utf-8').decode(bytes);
    }else{
      txt = decodeURIComponent(escape(bin));
    }
    KEY_CACHE = JSON.parse(txt);
    return KEY_CACHE;
  }

  function renderQ(q){
    var no = NO[q.id];
    var saved = state.answers[q.id] || '';
    var html = '';
    html += '<article class="qcard" id="card-' + q.id + '" data-qid="' + q.id + '">';
    html += '<div class="qtop">';
    html += '<label class="pick" title="勾选后可打印本题"><input type="checkbox" data-act="pick" data-qid="' + q.id + '" aria-label="勾选第 ' + no + ' 题用于打印"><span class="pbox"></span></label>';
    html += '<span class="qno">' + no + '</span>';
    html += '<span class="tag ' + tagClass(q.d) + '">' + difName(q.d) + '</span>';
    html += '</div>';
    html += '<div class="stem">' + q.stem + '</div>';

    if(q.t === 'choice'){
      html += '<div class="opts">';
      for(var i = 0; i < q.opts.length; i++){
        var L = letter(i);
        var sel = (saved.toUpperCase() === L) ? ' sel' : '';
        html += '<label class="opt' + sel + '" data-opt="' + L + '">';
        html += '<input type="radio" name="' + q.id + '" value="' + L + '" data-act="opt" data-qid="' + q.id + '">';
        html += '<span class="odot"></span><span class="okey">' + L + '</span>';
        html += '<span class="otext">' + q.opts[i] + '</span>';
        html += '</label>';
      }
      html += '</div>';
    }else{
      html += '<div class="fillrow"><label class="fill">答：';
      html += '<input class="finput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" ';
      html += 'data-act="fill" data-qid="' + q.id + '" value="' + esc(saved) + '" aria-label="第 ' + no + ' 题作答">';
      if(q.unit){ html += '<span class="unit">' + q.unit + '</span>'; }
      html += '</label></div>';
    }

    html += '<div class="fb" id="fb-' + q.id + '" hidden></div>';
    html += '</article>';
    return html;
  }

  function renderQuiz(){

    for(var gi = 0; gi < GROUPS.length; gi++){
      var list = QS.filter(function(q){ return q.g === gi; });
      if(!list.length) continue;
      html += '<section class="group" id="grp-' + gi + '">';
      html += '<div class="ghead">';
      html += '<span class="gidx">' + (gi + 1 < 10 ? '0' + (gi + 1) : (gi + 1)) + '</span>';
      html += '<div class="gtitle"><h2>' + GROUPS[gi].name + '</h2><p>' + GROUPS[gi].desc + '</p></div>';
      html += '<span class="gcount">' + list.length + ' 题</span>';
      html += '</div>';
      for(var i = 0; i < list.length; i++){ html += renderQ(list[i]); }
      html += '</section>';
    }
    els.quiz.innerHTML = html;
  }

  function updateCounts(){
    var answered = 0, picked = 0;
    QS.forEach(function(q){ if((state.answers[q.id] || '').trim() !== '') answered++; });
    if(els.quiz){
      var boxes = els.quiz.querySelectorAll('input[data-act="pick"]');
      for(var i = 0; i < boxes.length; i++){ if(boxes[i].checked) picked++; }
    }
    if(els.statAns) els.statAns.textContent = String(answered);
    if(els.statPick) els.statPick.textContent = String(picked);
    if(els.statHint){
      els.statHint.textContent = state.submitted
        ? ('已判分 · 正确 ' + state.correct + '/' + TOTAL)
        : '未提交';
    }
  }

    QS.forEach(function(q){
      var k = KEY[q.id];
      if(!k || !k.a){ throw new Error('题库缺少第 ' + NO[q.id] + ' 题的答案'); }
      var stu = (state.answers[q.id] || '').trim();
      var ok = stu !== '' && sameAns(q, stu, k.a);
      var cause = null;
      if(!ok){
        cause = (q.t === 'choice' && k.pm && k.pm[stu.toUpperCase()]) ? k.pm[stu.toUpperCase()] : k.m;
        if(!MINFO[cause]) cause = 'M1';
      }
      res[q.id] = { ok:ok, stu:stu, correct:k.a, exp:k.e, cause:cause, blank:(stu === '') };
      if(ok) correct++;
    });
    state.results = res;
    state.correct = correct;
    return res;
  }

  function paintOne(q){
    var r = state.results[q.id];
    var card = document.getElementById('card-' + q.id);
    if(!card) return;
    if(r.ok){ card.classList.add('is-ok'); } else { card.classList.add('is-no'); }

    if(q.t === 'choice'){
      var opts = card.querySelectorAll('.opt');
      for(var i = 0; i < opts.length; i++){
        var L = opts[i].getAttribute('data-opt');
        var input = opts[i].querySelector('input');
        if(input){ input.disabled = true; }
        if(L === String(r.correct).toUpperCase()){ opts[i].classList.add('right'); }
        if(L === r.stu.toUpperCase() && !r.ok){ opts[i].classList.add('wrong'); }
      }
    }else{
      var fi = card.querySelector('.finput');
      if(fi){ fi.disabled = true; }
    }

    var fb = document.getElementById('fb-' + q.id);
    if(!fb) return;
    var youText;
    if(r.blank){
      youText = '未作答';
    }else if(q.t === 'choice'){
      var idx = 'ABCD'.indexOf(r.stu.toUpperCase());
      youText = r.stu.toUpperCase() + '. ' + (idx >= 0 && q.opts[idx] ? q.opts[idx] : '');
    }else{
      youText = r.stu + (q.unit ? ' ' + q.unit : '');
    }
    var ansText;
    if(q.t === 'choice'){
      var ai = 'ABCD'.indexOf(String(r.correct).toUpperCase());
      ansText = String(r.correct).toUpperCase() + '. ' + (ai >= 0 && q.opts[ai] ? q.opts[ai] : '');
    }else{
      ansText = r.correct + (q.unit ? ' ' + q.unit : '');
    }

    var h = '';
    h += '<div class="fbrow">';
    h += '<span class="verdict">' + (r.ok ? '✔ 正确' : '✘ 错误') + '</span>';
    h += '<span class="you">你的作答：' + esc(youText) + '</span>';
    h += '<span class="ansline">正确答案：<b>' + esc(ansText) + '</b></span>';
    h += '</div>';
    h += '<p class="explain"><b>简析：</b>' + esc(r.exp) + '</p>';
    if(!r.ok){
      h += '<p class="cause">错因归类：' + r.cause + ' ' + MINFO[r.cause].name + (r.blank ? '（本题未作答，按该题典型错因归档）' : '') + '</p>';
    }
    fb.className = 'fb ' + (r.ok ? 'ok' : 'no');
    fb.innerHTML = h;
    fb.hidden = false;
  }

  /* ============================================================
     5. 分析报告
     ============================================================ */
  function buildReport(){
    var res = state.results;
    var total = QS.length;
    var correct = state.correct;
    var rate = Math.round(correct / total * 100);

    var dstat = { D1:{t:0,c:0}, D2:{t:0,c:0}, D3:{t:0,c:0} };
    var M = { M1:0, M2:0, M3:0, M4:0, M5:0 };
    var mq = { M1:[], M2:[], M3:[], M4:[], M5:[] };
    var wrongNos = [];
    var blankNos = [];

    QS.forEach(function(q){
      var r = res[q.id];
      dstat[q.d].t++;
      if(r.ok){ dstat[q.d].c++; }
      else{
        wrongNos.push(NO[q.id]);
        if(r.blank) blankNos.push(NO[q.id]);
        M[r.cause] = (M[r.cause] || 0) + 1;
        if(mq[r.cause]) mq[r.cause].push(NO[q.id]);
      }
    });

    var gstat = [];
    for(var gi = 0; gi < GROUPS.length; gi++){
      var list = QS.filter(function(q){ return q.g === gi; });
      if(!list.length) continue;
      var wrong = list.filter(function(q){ return !res[q.id].ok; });
      gstat.push({
        name:GROUPS[gi].name, desc:GROUPS[gi].desc,
        total:list.length, wrong:wrong.length,
        ratio:wrong.length / list.length,
        wrongNos:wrong.map(function(q){ return NO[q.id]; })
      });
    }

    var h = '';
    h += '<div class="rhead"><h2>分析报告</h2><span class="line"></span><span class="gcount">' + STUDENT + '</span></div>';

    /* 总览 */
    h += '<div class="rcards">';
    h += '<div class="rcard main"><span class="rlabel">本卷正确率</span><span class="rnum">' + rate + '%</span>';
    h += '<span class="rsub">答对 ' + correct + ' 题 / 共 ' + total + ' 题' + (wrongNos.length ? '，错 ' + wrongNos.length + ' 题' : '，全对') + '</span></div>';
    ['D1','D2','D3'].forEach(function(d){
      var s = dstat[d];
      var p = s.t ? Math.round(s.c / s.t * 100) : 0;
      h += '<div class="rcard"><span class="rlabel">' + difName(d) + '</span>';
      h += '<span class="rnum">' + s.c + '/' + s.t + '</span>';
      h += '<span class="rsub">正确率 ' + p + '%</span>';
      h += '<div class="dbar"><i class="' + (p < 60 ? 'warn' : '') + '" style="width:' + p + '%"></i></div></div>';
    });
    h += '</div>';

    /* 一、错因归类 */
    h += '<div class="rblock"><h3><span class="n">1</span>逐题错因归类（M1–M5）</h3>';
    if(!wrongNos.length){
      h += '<p class="advice">全卷无错题，没有错因需要归类。建议直接进入下一层次的综合题或变式题训练。</p>';
    }else{
      var codes = ['M1','M2','M3','M4','M5'].filter(function(k){ return M[k] > 0; });
      codes.sort(function(a,b){ return M[b] - M[a]; });
      codes.forEach(function(k){
        h += '<div class="mrow"><span class="mcode">' + k + '</span>';
        h += '<span class="mbody"><span class="mt">' + MINFO[k].name + '</span>';
        h += '<span class="ms">' + MINFO[k].tip + ' 涉及第 ' + mq[k].join('、') + ' 题。</span></span>';
        h += '<span class="mcount">' + M[k] + ' 题</span></div>';
      });
      if(blankNos.length){
        h += '<div class="mrow"><span class="mcode">未答</span><span class="mbody"><span class="mt">共 ' + blankNos.length + ' 题未作答</span>';
        h += '<span class="ms">第 ' + blankNos.join('、') + ' 题空白，已按该题典型错因归类，建议单独限时重做。</span></span>';
        h += '<span class="mcount">' + blankNos.length + ' 题</span></div>';
      }
      h += '<div class="kwlist">';
      h += '<button type="button" class="kwbtn" data-act="pickwrong">勾选全部错题</button>';
      h += '<button type="button" class="kwbtn" data-act="print">打印错题稿（另存 PDF）</button>';
      h += '</div>';
    }
    h += '</div>';

    /* 二、未掌握知识点 */
    h += '<div class="rblock"><h3><span class="n">2</span>未掌握知识点清单（将进入「学」环节）</h3>';
    var needLearn = gstat.filter(function(g){ return g.wrong > 0; });
    if(!needLearn.length){
      h += '<p class="advice">本卷所有知识点均已掌握，无需进入「学」环节补漏。</p>';
    }else{
      needLearn.sort(function(a,b){ return (b.ratio - a.ratio) || (b.wrong - a.wrong); });
      needLearn.forEach(function(g){
        var st = (g.wrong >= 2 || g.ratio >= 0.5) ? 'no' : 'mid';
        var stTxt = st === 'no' ? '未掌握' : '待巩固';
        h += '<div class="grow"><span class="gname">' + g.name + '<em>错 ' + g.wrong + ' / 共 ' + g.total + ' 题 · 第 ' + g.wrongNos.join('、') + ' 题</em></span>';
        h += '<span class="st ' + st + '">' + stTxt + '</span></div>';
      });
      h += '<p class="advice" style="margin-top:8px">以上 «未掌握 / 待巩固» 知识点将进入「学」环节：先看知识点微课 → 再做同类基础题 5 道 → 最后回到错题重做。</p>';
    }
    h += '</div>';

    /* 三、再练建议 */
    h += '<div class="rblock"><h3><span class="n">3</span>再练建议</h3>';
    h += '<ol class="advice">';
    if(!wrongNos.length){
      h += '<li><b>保持手感：</b>本卷全对，建议 3 天后做 10 道 D3 高难度变式题，重点练逆向求解与多条件问题。</li>';
      h += '<li><b>提速训练：</b>用 25 分钟限时重做本卷，检验稳定性。</li>';
      h += '<li><b>迁移拓展：</b>把本卷的搭配题换成 3 张数字卡片与加减法两步题结合，自编 2 道题并解答。</li>';
    }else{
      var topM = ['M1','M2','M3','M4','M5'].filter(function(k){ return M[k] > 0; })
        .sort(function(a,b){ return M[b] - M[a]; })[0];
      var weakNames = needLearn.slice(0, 2).map(function(g){ return '《' + g.name + '》'; }).join('、');
      h += '<li><b>优先补漏：</b>先回到 ' + (weakNames || '错题所在知识点') + '，把课本例题重读一遍，再做同类型基础题 5 道。</li>';
      var mAdvice = {
        M1:'每天用 5 分钟背一遍乘法口诀，并把「1 米 = 100 厘米」「角的分类」做成小卡片各读 3 遍。',
        M2:'每天 10 分钟口算专项：20 以内进位加、退位减、表内乘法各 10 题，要求 3 分钟内全对。',
        M3:'读题时先圈关键词（多、少、一共、还剩、每个），检查单位是否统一；遇到「一个星期」「一盒」这类词先写出它等于多少。',
        M4:'多步应用题按「先求什么、再求什么」写小标题再列式，做完回读一遍是否答完题目所问。',
        M5:'练 5 道逆向题（看错的数、找回的钱、求原来多少）+ 2 道搭配枚举题，枚举时按「固定十位」的顺序写，做到不重不漏。'
      };
      h += '<li><b>错因专项：</b>本次主要错因是 <b>' + topM + ' ' + MINFO[topM].name + '</b>。' + mAdvice[topM] + '</li>';
      h += '<li><b>错题复测：</b>勾选全部错题后点「打印选中错题（另存 PDF）」，3 天后重做这 ' + wrongNos.length + ' 题，做对为止。</li>';
      h += '<li><b>同类迁移：</b>7 天后做 10 道同知识点变式题（难度提高一档），检验是否真正掌握。</li>';
    }
    h += '</ol></div>';

    return h;
  }

  function renderReport(){
    var h = buildReport();
    els.report.innerHTML = h;
    els.report.hidden = false;
    syncBarHeight();
    try{
      els.report.scrollIntoView({ behavior:'smooth', block:'start' });
    }catch(e){
      window.scrollTo(0, els.report.offsetTop - 8);
    }
  }

  /* ============================================================
     6. 打印
     ============================================================ */
  function buildPrint(ids){
    var res = state.results;
    var KEY = decodeKey();
    var rate = Math.round(state.correct / QS.length * 100);
    var h = '';
    h += '<div class="phead"><h1>' + TITLE + ' · 错题打印稿</h1>';
    h += '<div class="psub">共 ' + ids.length + ' 道错题（题干 / 学生作答 / 正确答案 / 解析逐题完整呈现）</div>';
    h += '<div class="pinfo"><span>学习者：' + STUDENT + '</span>';
    h += '<span>打印日期：' + fmtDate() + '</span>';
    h += '<span>本卷正确率：' + rate + '%（' + state.correct + '/' + QS.length + '）</span></div></div>';

    ids.forEach(function(qid){
      var q = null;
      for(var i = 0; i < QS.length; i++){ if(QS[i].id === qid){ q = QS[i]; break; } }
      if(!q) return;
      var r = res[qid];
      var k = KEY[qid];
      var no = NO[qid];
      var stuTxt, ansTxt;
      if(r.blank){
        stuTxt = '未作答';
      }else if(q.t === 'choice'){
        var i1 = 'ABCD'.indexOf(r.stu.toUpperCase());
        stuTxt = r.stu.toUpperCase() + '. ' + (i1 >= 0 && q.opts[i1] ? q.opts[i1] : '');
      }else{
        stuTxt = r.stu + (q.unit ? ' ' + q.unit : '');
      }
      if(q.t === 'choice'){
        var i2 = 'ABCD'.indexOf(String(k.a).toUpperCase());
        ansTxt = String(k.a).toUpperCase() + '. ' + (i2 >= 0 && q.opts[i2] ? q.opts[i2] : '');
      }else{
        ansTxt = k.a + (q.unit ? ' ' + q.unit : '');
      }

      h += '<div class="pq">';
      h += '<div class="pqhead"><b>第 ' + no + ' 题</b> · ' + difName(q.d) + ' · ' + GROUPS[q.g].name + '</div>';
      h += '<div class="pqstem">' + q.stem + '</div>';
      h += '<div class="pqline"><span class="lb">学生作答：</span><span class="bad">' + esc(stuTxt) + '</span></div>';
      h += '<div class="pqline"><span class="lb">正确答案：</span><span class="good">' + esc(ansTxt) + '</span></div>';
      h += '<div class="pqline"><span class="lb">解析：</span>' + esc(k.e) + '</div>';
      h += '<div class="pqline"><span class="lb">错因：</span>' + r.cause + ' ' + MINFO[r.cause].name + '</div>';
      h += '</div>';
    });
    h += '<div class="pfoot">© 两英豆豆教练 · 豆豆智学 · 微信 ddtt0754</div>';
    els.printArea.innerHTML = h;
  }

  /* ============================================================
     7. 动作
     ============================================================ */
  function onSubmit(btn){
    if(state.submitted){ toast('本卷已判分，如需重做请点「重新作答」'); return; }
    var answered = 0;
    QS.forEach(function(q){ if((state.answers[q.id] || '').trim() !== '') answered++; });
    var blank = QS.length - answered;
    if(blank > 0 && !state.confirmSubmit){
      state.confirmSubmit = true;
      toast('还有 ' + blank + ' 题未作答，再点一次「提交判分」将按未作答判分');
      window.clearTimeout(timers.submit);
      timers.submit = window.setTimeout(function(){ state.confirmSubmit = false; }, 5000);
      return;
    }
    state.confirmSubmit = false;
    btn.disabled = true;
    btn.textContent = '判分中';
    window.setTimeout(function(){
      try{
        grade();
        state.submitted = true;
        QS.forEach(paintOne);
        btn.textContent = '已提交';
        btn.disabled = true;
        renderReport();
        updateCounts();
        toast('判分完成：答对 ' + state.correct + '/' + QS.length + '，下拉查看分析报告');
      }catch(err){
        btn.disabled = false;
        btn.textContent = '提交判分';
        showError('判分失败：' + (err && err.message ? err.message : err));
      }
    }, 40);
  }

  function onReset(btn){
    if(!state.confirmReset){
      state.confirmReset = true;
      btn.textContent = '再点一次确认重置';
      toast('重置会清空全部作答与报告');
      window.clearTimeout(timers.reset);
      timers.reset = window.setTimeout(function(){
        state.confirmReset = false;
        btn.textContent = '重新作答';
      }, 4000);
      return;
    }
    state.confirmReset = false;
    btn.textContent = '重新作答';
    state.answers = {};
    state.submitted = false;
    state.results = null;
    state.correct = 0;
    state.confirmSubmit = false;
    state.printing = false;
    els.report.hidden = true;
    els.report.innerHTML = '';
    els.printArea.innerHTML = '';
    if(els.btnSubmit){
      els.btnSubmit.disabled = false;
      els.btnSubmit.textContent = '提交判分';
    }
    renderQuiz();
    updateCounts();
    try{ window.scrollTo({ top:0, behavior:'smooth' }); }catch(e){ window.scrollTo(0, 0); }
    toast('已重置，可以重新作答');
  }

  function onPickWrong(){
    if(!state.submitted){ toast('请先提交判分，再勾选错题'); return; }
    var boxes = els.quiz.querySelectorAll('input[data-act="pick"]');
    var n = 0;
    for(var i = 0; i < boxes.length; i++){
      var r = state.results[boxes[i].getAttribute('data-qid')];
      var bad = !!(r && !r.ok);
      boxes[i].checked = bad;
      if(bad) n++;
    }
    updateCounts();
    toast(n ? ('已勾选 ' + n + ' 道错题，可点「打印选中错题」') : '本卷没有错题，全部答对了');
  }

  function onPrint(btn){
    if(state.printing){ return; }
    if(!state.submitted){ toast('请先点「提交判分」，再勾选错题打印'); return; }
    var boxes = els.quiz.querySelectorAll('input[data-act="pick"]');
    var checkedTotal = 0;
    var ids = [];
    for(var i = 0; i < boxes.length; i++){
      if(!boxes[i].checked) continue;
      checkedTotal++;
      var qid = boxes[i].getAttribute('data-qid');
      var r = state.results[qid];
      if(r && !r.ok){ ids.push(qid); }
    }
    if(checkedTotal === 0){ toast('请先勾选要打印的错题'); return; }
    if(ids.length === 0){ toast('勾选的题目都答对了，没有错题可打印'); return; }

    state.printing = true;
    btn.disabled = true;
    var old = btn.textContent;
    btn.textContent = '正在准备打印';
    try{
      buildPrint(ids);
      window.setTimeout(function(){
        try{
          window.print();
        }catch(e1){
          showError('无法唤起打印对话框，请用浏览器菜单「打印」');
        }
        btn.disabled = false;
        btn.textContent = old;
        state.printing = false;
      }, 80);
    }catch(err){
      btn.disabled = false;
      btn.textContent = old;
      state.printing = false;
      showError('打印准备失败：' + (err && err.message ? err.message : err));
    }
  }

  /* ============================================================
     8. 事件绑定（全部事件委托）
     ============================================================ */
  function bind(){
    /* 题目区：改写答案 / 勾选 */
    els.quiz.addEventListener('change', function(e){
      var t = e.target;
      if(!t || !t.getAttribute) return;
      var act = t.getAttribute('data-act');
      if(act === 'opt'){
        var qid = t.getAttribute('data-qid');
        state.answers[qid] = t.value;
        var labels = els.quiz.querySelectorAll('.opt');
        for(var i = 0; i < labels.length; i++){ labels[i].classList.remove('sel'); }
        var box = t.parentNode;
        if(box && box.classList){ box.classList.add('sel'); }
        if(state.submitted) return;
        state.confirmSubmit = false;
        updateCounts();
      }else if(act === 'pick'){
        updateCounts();
      }
    });

    /* 题目区：填空输入 */
    els.quiz.addEventListener('input', function(e){
      var t = e.target;
      if(!t || !t.getAttribute) return;
      if(t.getAttribute('data-act') !== 'fill') return;
      var qid = t.getAttribute('data-qid');
      var v = String(t.value || '').trim();
      if(v === ''){ delete state.answers[qid]; } else { state.answers[qid] = v; }
      state.confirmSubmit = false;
      updateCounts();
    });

    /* 底部操作条 */
    els.bar.addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('[data-act]') : null;
      if(!btn) return;
      var act = btn.getAttribute('data-act');
      try{
        if(act === 'submit'){ onSubmit(btn); }
        else if(act === 'reset'){ onReset(btn); }
        else if(act === 'print'){ onPrint(btn); }
        else if(act === 'pickwrong'){ onPickWrong(); }
      }catch(err){
        showError('操作失败：' + (err && err.message ? err.message : err));
      }
    });

    /* 报告区内的复用按钮（事件委托，报告重渲染后依然有效） */
    els.report.addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('[data-act]') : null;
      if(!btn) return;
      var act = btn.getAttribute('data-act');
      try{
        if(act === 'pickwrong'){ onPickWrong(); }
        else if(act === 'print'){ onPrint(els.btnPrint); }
      }catch(err){
        showError('操作失败：' + (err && err.message ? err.message : err));
      }
    });

    /* 联系与信息 */
    if(els.coach){
      var flip = function(){ els.coach.classList.toggle('show'); };
      els.coach.addEventListener('click', flip);
      els.coach.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); flip(); }
      });
    }
  }

  /* ============================================================
     8.5 底栏高度同步（保证正文不被固定栏遮挡、提示条不压按钮）
     ============================================================ */
  function syncBarHeight(){
    if(!els.bar) return;
    var h = els.bar.offsetHeight || 0;
    if(h > 0){ document.documentElement.style.setProperty('--barh', h + 'px'); }
  }

  /* ============================================================
     9. 启动
     ============================================================ */
  function boot(){
    try{
      els.toast = must('toast');
      els.err = must('errBanner');
      els.quiz = must('quizArea');
      els.report = must('reportArea');
      els.printArea = must('printArea');
      els.bar = must('actionbar');
      els.btnSubmit = must('btnSubmit');
      els.btnPrint = must('btnPrint');
      els.statAns = must('statAns');
      els.statPick = must('statPick');
      els.statHint = must('statHint');
      els.coach = document.getElementById('coachTip');

      if(QS.length !== TOTAL){
        throw new Error('题库数量异常：应为 ' + TOTAL + ' 题，实际 ' + QS.length + ' 题');
      }
      renderQuiz();
      bind();
      updateCounts();
      syncBarHeight();
      window.addEventListener('resize', syncBarHeight);
      window.addEventListener('orientationchange', function(){ window.setTimeout(syncBarHeight, 120); });
    }catch(err){
      var box = document.getElementById('errBanner');
      if(box){
        box.hidden = false;
        box.textContent = '页面初始化失败：' + (err && err.message ? err.message : err);
      }
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  }else{
    boot();
  }
})();
</script>
</body>
</html>
