<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=3.0">
<meta name="theme-color" content="#2ebd85">
<title>豆豆智学 · 同步学</title>
<style>
:root{--g:#2ebd85;--b:#2f9df0;--t:#33434b;--l:#8aa09a;--border:#e1eeea;--card:#fff;--danger:#ef4444;--bg:#f5fbf8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#eefaf4,#eef4fb);color:var(--t);font-size:15px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:760px;padding:14px 14px 0;flex:1}
.hdr{position:relative;background:linear-gradient(135deg,#35d29a,#2f9df0);border-radius:20px;padding:20px 18px 18px;text-align:center;color:#fff;overflow:hidden;box-shadow:0 14px 30px rgba(47,157,240,.25);margin-bottom:12px}
.hdr::before,.hdr::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hdr::before{width:120px;height:120px;top:-40px;right:-30px}
.hdr::after{width:70px;height:70px;bottom:-24px;left:-16px}
.hdr h1{position:relative;font-size:20px;font-weight:700}
.hdr .sub{position:relative;margin-top:6px;font-size:12px;opacity:.95}
.back-link{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;background:var(--card);border:1.5px solid var(--border);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--t);text-decoration:none;transition:all .2s;margin-right:8px;margin-bottom:8px}
.back-link:hover{border-color:var(--b);color:var(--b)}
.know-card{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:0 4px 14px rgba(47,157,240,.06);margin-bottom:12px;border-left:4px solid var(--b)}
.know-card h3{font-size:15px;color:var(--b);margin-bottom:8px}
.know-card .rule{padding:8px 12px;background:#f0fdf4;border-left:3px solid var(--g);border-radius:6px;margin:8px 0;font-size:13px;line-height:1.7}
.q-card{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:0 4px 14px rgba(47,157,240,.06);margin-bottom:10px}
.q-card .q-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.q-card .q-badge{background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;border-radius:999px;padding:4px 14px;font-size:12px;font-weight:700;white-space:nowrap}
.q-card .q-title{font-size:14px;font-weight:700;color:var(--t)}
.q-card .q-stem{font-size:14px;line-height:1.75;color:var(--t);background:var(--bg);padding:12px 14px;border-radius:10px;margin-bottom:10px}
.ans-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ans-inp{flex:1;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;outline:none;transition:border-color .2s}
.ans-inp:focus{border-color:var(--b)}
.ans-inp:disabled{background:#f1f5f9}
.ans-btn{padding:10px 22px;background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.ans-btn:hover{transform:translateY(-1px)}
.ans-btn:disabled{opacity:.5;cursor:not-allowed}
.feedback{display:none;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.7;margin-top:8px}
.feedback.show{display:block}
.feedback.ok{background:#f0fdf4;border-left:4px solid var(--g);color:#15803d}
.feedback.err{background:#fef2f2;border-left:4px solid var(--danger);color:#991b1b}
.feedback .user-ans{text-decoration:line-through;margin-right:6px}
.feedback .correct-ans{font-weight:700}
.feedback .explain{margin-top:6px;font-size:12.5px;color:#555;line-height:1.6}
.bt-home{display:block;width:fit-content;margin:18px auto 8px;padding:11px 26px;background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;border:none;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;box-shadow:0 4px 14px rgba(47,157,240,.22)}
.site-footer{text-align:center;padding:12px 0 22px;color:var(--l);font-size:.72rem;border-top:1px solid var(--border);margin-top:6px;width:100%}
</style>
</head>
<body>
<div class="wrap">
<header class="hdr"><h1>📏 勾股定理</h1><p class="sub">八年级下册 · 2 类题型共 10 题</p></header>
<div><a class="back-link" href="index.html">← 返回专题导航</a><a class="back-link" href="../index.html">🏠 回到首页</a></div>
<div class="know-card"><h3>📖 知识要点与难点突破</h3><div class="rule"><b>勾股定理：</b>直角△两直角边 a,b，斜边 c，则 a²+b²=c²<BR><b>逆定理：</b>若 a²+b²=c²，则该三角形为直角三角形<br><b>常见勾股数：</b>3,4,5；5,12,13；8,15,17<br><b>应用：</b>求边长、判定直角、实际测量</div></div>
<div id="qContainer"></div>
<a class="bt-home" href="index.html">← 返回专题导航</a>
<footer class="site-footer">&copy; 两英豆豆教练</footer>
</div>
<script>
(function(){
'use strict';
const TOPICS = [
 {
  "name": "直接应用",
  "title": "题型1 · 直接应用",
  "items": [
   {
    "qid": "1",
    "stem": "直角△两直角边为 3 和 4，则斜边长为______。",
    "ans": "5",
    "explain": "3²+4²=25=5²。"
   },
   {
    "qid": "2",
    "stem": "直角△斜边为 13，一直角边为 5，另一直角边为______。",
    "ans": "12",
    "explain": "13²-5²=144=12²。"
   },
   {
    "qid": "3",
    "stem": "等腰直角三角形直角边长为 1，则斜边长为______。",
    "ans": "√2",
    "explain": "1²+1²=2，斜边=√2。"
   },
   {
    "qid": "4",
    "stem": "若三角形三边为 6,8,10，则该三角形______（填\"是\"或\"不是\"）直角三角形。",
    "ans": "是",
    "explain": "6²+8²=100=10²。"
   },
   {
    "qid": "5",
    "stem": "正方形边长为 2，其对角线长为______。",
    "ans": "2√2",
    "explain": "对角线=√(2²+2²)=√8=2√2。"
   }
  ]
 },
 {
  "name": "实际应用",
  "title": "题型2 · 实际应用",
  "items": [
   {
    "qid": "1",
    "stem": "旗杆离地 9m 处折断，顶端落地点离杆底 12m，则折断处距顶端______m。",
    "ans": "15",
    "explain": "折断部分、9m、12m 构成直角△，折断部分=√(9²+12²)=15。"
   },
   {
    "qid": "2",
    "stem": "从离水面 3m 的桥墩顶垂绳到水面，绳长 5m，则水平距离为______m。",
    "ans": "4",
    "explain": "水平距离=√(5²-3²)=√16=4。"
   },
   {
    "qid": "3",
    "stem": "三边 5,12,13 ______（填\"能\"或\"不能\"）构成直角三角形。",
    "ans": "能",
    "explain": "满足逆定理。"
   },
   {
    "qid": "4",
    "stem": "直角△周长为 12，三边为 3,4,5，则其面积为______。",
    "ans": "6",
    "explain": "面积=3×4/2=6。"
   },
   {
    "qid": "5",
    "stem": "直角△斜边是直角边 2 倍，设直角边为 a，则斜边为______，另一直角边为______。",
    "ans": "2a,√3a",
    "explain": "斜边 2a，另一直角边=√((2a)²-a²)=√3a。"
   }
  ]
 }
];
let currentTopic = 0;
let currentItem = 0;
let answered = {};
function getKey(){ return currentTopic+'-'+currentItem; }
function render(){
  const c = document.getElementById('qContainer');
  let h = '';
  for (let ti=0;ti<TOPICS.length;ti++){
    const tp=TOPICS[ti];
    const op=ti===currentTopic;
    h+='<div class="q-card"><div class="q-head"><span class="q-badge" style="font-size:11px">题型'+(ti+1)+'</span><span class="q-title" style="cursor:pointer;font-size:13px" onclick="switchTopic('+ti+')">'+tp.title+'</span></div>';
    if(op){
      for(let ii=0;ii<tp.items.length;ii++){
        const it=tp.items[ii],key=ti+'-'+ii,ans=answered[key];
        const bg=(ti===currentTopic&&ii===currentItem)?'background:#eff6ff;border:2px solid var(--b)':'';
        h+='<div style="margin-top:8px;padding:10px 12px;border-radius:10px;'+bg+'" id="item-'+key+'">';
        h+='<div style="font-size:12px;font-weight:700;color:var(--b);margin-bottom:4px">Q'+it.qid+'</div>';
        h+='<div class="q-stem" style="font-size:13px;margin-bottom:0">'+it.stem+'</div>';
        if(!ans){
          h+='<div class="ans-row" style="margin-top:8px"><input class="ans-inp" id="inp-'+key+'" placeholder="输入答案..." onkeydown="if(event.key===13)submitOne(\''+key+'\')"><button class="ans-btn" onclick="submitOne(\''+key+'\')">确认</button></div>';
        }
        if(ans){
          h+='<div class="feedback show '+(ans.ok?'ok':'err')+'">';
          h+=ans.ok?'✓ 正确！答案：<b>'+ans.correct+'</b>':'✗ <span class="user-ans">你的答案：'+ans.input+'</span> 正确答案：<span class="correct-ans">'+ans.correct+'</span>';
          h+='<div class="explain">'+it.explain+'</div></div>';
        }
        h+='</div>';
      }
    }
    h+='</div>';
  }
  c.innerHTML=h;
  const el=document.getElementById('item-'+getKey());
  if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
}
function switchTopic(ti){ currentTopic=ti;currentItem=0;render();window.scrollTo({top:0,behavior:'smooth'}); }
function submitOne(key){
  const p=key.split('-'),ti=parseInt(p[0]),ii=parseInt(p[1]);
  const q=TOPICS[ti].items[ii],inp=document.getElementById('inp-'+key);
  if(!inp)return;
  const v=inp.value.trim();
  if(!v){inp.focus();return;}
  const nv=v.toLowerCase().replace(/\s+/g,''),na=q.ans.toLowerCase().replace(/\s+/g,'');
  let ok=nv===na,ov=Number(v),oa=Number(q.ans);
  if(!isNaN(ov)&&!isNaN(oa)&&Math.abs(ov-oa)<0.01)ok=true;
  if(na.includes(nv)&&nv.length>1)ok=true;
  if(nv.includes(na)&&na.length>1)ok=true;
  answered[key]={input:v,correct:q.ans,ok:ok};
  currentTopic=ti;currentItem=ii;render();
}
window.submitOne=submitOne;
window.switchTopic=switchTopic;
render();
})();
</script>
</body>
</html>
