<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>数学专项培优训练</title>
<style>
:root {
  --bg: #f5f7fa;
  --text: #2c3e50;
  --text2: #7f8c8d;
  --card: #fff;
  --shadow: 0 2px 16px rgba(0,0,0,.06);
  --radius: 16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
}
.container { max-width: 720px; width: 100%; padding: 32px 20px 0; flex: 1; }

/* Header */
.header { text-align: center; margin-bottom: 36px; }
.header h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: .04em; margin-bottom: 6px; }
.header .sub { font-size: .85rem; color: var(--text2); font-weight: 400; }
.header .brand { font-size: .78rem; color: var(--text2); margin-top: 2px; }

/* 八宫格 4×2 */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
.grid a {
  text-decoration: none; display: block;
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 24px 16px; text-align: center; transition: transform .15s, box-shadow .15s;
  border: 2px solid transparent; cursor: pointer;
}
.grid a:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,.1); }
.grid a:active { transform: scale(.97); }
.grid .card-icon { font-size: 2.4rem; margin-bottom: 10px; }
.grid .card-title { font-size: .95rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.grid .card-desc { font-size: .7rem; color: var(--text2); line-height: 1.5; }

/* 各格子的强调色 */
.calc { border-color: #3b82f6; }
.calc .card-icon { color: #3b82f6; }
.calc:hover { border-color: #2563eb; }

.determine { border-color: #22c55e; }
.determine .card-icon { color: #22c55e; }
.determine:hover { border-color: #16a34a; }

.thoughts { border-color: #f59e0b; }
.thoughts .card-icon { color: #f59e0b; }
.thoughts:hover { border-color: #d97706; }

.model { border-color: #a855f7; }
.model .card-icon { color: #a855f7; }
.model:hover { border-color: #9333ea; }

.classic { border-color: #ec4899; }
.classic .card-icon { color: #ec4899; }
.classic:hover { border-color: #db2777; }

.diagnose { border-color: #14b8a6; }
.diagnose .card-icon { color: #14b8a6; }
.diagnose:hover { border-color: #0d9488; }

.schulte { border-color: #e67e22; }
.schulte .card-icon { color: #e67e22; }
.schulte:hover { border-color: #d35400; }

.sim { border-color: #8e44ad; }
.sim .card-icon { color: #8e44ad; }
.sim:hover { border-color: #6c3483; }

/* Footer */
.site-footer {
  text-align: center; padding: 16px 0 20px;
  color: var(--text2); font-size: .75rem;
  border-top: 1px solid #e2e8f0; margin-top: auto;
}

/* 教练微信号提示框 */
.coach-tip {
  position: relative; display: inline-block;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.coach-tip .tip {
  visibility: hidden; opacity: 0;
  position: absolute; bottom: 145%; left: 50%;
  transform: translateX(-50%) translateY(4px);
  background: linear-gradient(135deg,#35d29a,#2f9df0); color: #fff;
  padding: 7px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 700;
  white-space: nowrap; letter-spacing: .5px; z-index: 99; pointer-events: none;
  box-shadow: 0 6px 18px rgba(47,157,240,.35);
  transition: opacity .2s ease, transform .2s ease, visibility .2s;
}
.coach-tip .tip::after {
  content: ""; position: absolute; top: 100%; left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent; border-top-color: #2f9df0;
}
.coach-tip:hover .tip, .coach-tip:active .tip, .coach-tip:focus .tip {
  visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0);
}

/* 移动端 2 列 */
@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .header h1 { font-size: 1.35rem; }
}

/* ========== 手机号验证锁屏 ========== */
.lock-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(15,23,42,.78); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
.lock-overlay.hidden { display: none; }
.lock-card {
  background: #fff; border-radius: 20px; padding: 32px 28px 24px;
  width: 340px; max-width: 92vw; text-align: center;
  box-shadow: 0 24px 60px rgba(0,0,0,.25); animation: lockIn .35s ease;
}
@keyframes lockIn { from { opacity:0; transform: translateY(20px) scale(.96); } to { opacity:1; transform: translateY(0) scale(1); } }
.lock-card .lock-icon { font-size: 48px; margin-bottom: 6px; }
.lock-card h2 { font-size: 18px; font-weight: 800; color: #1e293b; margin-bottom: 6px; }
.lock-card .lock-desc { font-size: 12px; color: #94a3b8; margin-bottom: 18px; line-height: 1.6; }
.lock-input-row { display: flex; gap: 8px; }
.lock-input-row input {
  flex: 1; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 12px;
  font-size: 16px; outline: none; text-align: center; letter-spacing: 2px;
  font-family: inherit; transition: border-color .2s;
}
.lock-input-row input:focus { border-color: #3b82f6; }
.lock-input-row input.error { border-color: #ef4444; background: #fef2f2; animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.lock-input-row button {
  padding: 12px 22px; background: linear-gradient(135deg,#35d29a,#2f9df0);
  color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
  cursor: pointer; white-space: nowrap; transition: transform .15s;
}
.lock-input-row button:hover { transform: scale(1.03); }
.lock-input-row button:active { transform: scale(.97); }
.lock-input-row button:disabled { opacity: .5; cursor: not-allowed; }
.lock-loading { display: none; margin-top: 10px; font-size: 12px; color: #64748b; }
.lock-loading.show { display: block; }
.lock-error { display: none; margin-top: 10px; padding: 8px 12px; background: #fef2f2;
  color: #dc2626; border-radius: 8px; font-size: 12px; font-weight: 600; }
.lock-error.show { display: block; }
.lock-hint { margin-top: 12px; font-size: 11px; color: #94a3b8; line-height: 1.6; }

</style>
</head>
<body>

<!-- 手机号验证锁屏 -->
<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <div class="lock-icon">🔐</div>
    <h2>请输入手机号验证</h2>
    <div class="lock-desc">首次访问需验证手机号<br>验证通过后可 7 天内免登录</div>
    <div class="lock-input-row">
      <input type="tel" id="phoneInput" placeholder="输入 11 位手机号" maxlength="11" inputmode="numeric" autofocus>
      <button id="verifyBtn" onclick="verifyPhone()">验证</button>
    </div>
    <div class="lock-loading" id="lockLoading">⏳ 正在验证…</div>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-hint">仅限已登记手机号访问<br>如有疑问请联系两英豆豆教练</div>
  </div>
</div>

<div class="container">
  <div class="header">
    <h1>数学专项培优训练</h1>
    <div class="sub">体系化计算与思维训练</div>
  </div>

  <div class="grid">
    <a href="knowledge/index.html" class="determine">
      <div class="card-icon">🎯</div>
      <div class="card-title">三定一性</div>
      <div class="card-desc">定义·定理·定律·性质</div>
    </a>
    <a href="calculation/index.html" class="calc">
      <div class="card-icon">🧮</div>
      <div class="card-title">计算专项</div>
      <div class="card-desc">九阶分阶训练 · 填空作答</div>
    </a>
    <a href="thinking/index.html" class="thoughts">
      <div class="card-icon">💡</div>
      <div class="card-title">十大思想</div>
      <div class="card-desc">分类讨论·数形结合·方程函数</div>
    </a>
    <a href="model/index.html" class="model">
      <div class="card-icon">🧩</div>
      <div class="card-title">模型思维</div>
      <div class="card-desc">几何模型·代数结构·解题套路</div>
    </a>
    <a href="classic/index.html" class="classic">
      <div class="card-icon">📐</div>
      <div class="card-title">经典题库</div>
      <div class="card-desc">真题精选·高频考点·一题多解</div>
    </a>
    <a href="test/index.html" class="diagnose">
      <div class="card-icon">📊</div>
      <div class="card-title">学期诊断</div>
      <div class="card-desc">知识点扫雷·薄弱项定位</div>
    </a>
    <a href="https://phet.colorado.edu/zh_CN/simulations/filter?subjects=math-and-statistics&type=html" class="sim" target="_blank">
      <div class="card-icon">🔬</div>
      <div class="card-title">模拟教材</div>
      <div class="card-desc">PhET 数学模拟实验</div>
    </a>
   <a href="concentration/index.html" class="schulte">
      <div class="card-icon">🔢</div>
      <div class="card-title">舒尔特方格</div>
      <div class="card-desc">专注力训练</div>
    </a>

  </div>
</div>

<footer class="site-footer">&copy; <span class="coach-tip" tabindex="0">两英豆豆教练<span class="tip">微信号 ddtt0754</span></span> &nbsp;·&nbsp; <a href="readme.html" style="color:#8aa09a">📖 网站说明</a></footer>

<script>
(function(){
  var overlay = document.getElementById('lockOverlay');
  var phoneInput = document.getElementById('phoneInput');
  var errEl = document.getElementById('lockError');
  var loadEl = document.getElementById('lockLoading');
  var btnEl = document.getElementById('verifyBtn');

  // 有效期 7 天
  var VALID_MS = 7 * 24 * 60 * 60 * 1000;
  var relockTimer = null;

  // Enter 键提交（始终绑定，保证重新锁屏后也能用）
  if (phoneInput) {
    phoneInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter') verifyPhone();
    });
  }
  window.verifyPhone = verifyPhone;

  // Check existing session (1 minute)
  var session = null;
  try { session = JSON.parse(localStorage.getItem('phone_session')); } catch(e) {}
  if (session && session.expires && Date.now() < session.expires) {
    if (overlay) overlay.classList.add('hidden');
    scheduleRelock(session.expires);
    return;
  }

  // Show overlay
  if (overlay) overlay.classList.remove('hidden');
  if (phoneInput) phoneInput.focus();

  // SHA-256 hash phone, fetch hash list, compare
  function sha256(str){
    var encoder = new TextEncoder();
    return crypto.subtle.digest('SHA-256', encoder.encode(str))
      .then(function(buf){
        return Array.from(new Uint8Array(buf))
          .map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      });
  }

  function verifyPhone(){
    var phone = phoneInput.value.replace(/\s+/g, '');
    if (!phone) { showErr('请输入手机号'); shake(); return; }
    if (!/^1\d{10}$/.test(phone)) { showErr('请输入正确的 11 位手机号'); shake(); return; }

    btnEl.disabled = true;
    loadEl.classList.add('show');
    errEl.classList.remove('show');
    phoneInput.classList.remove('error');

    // 兜底哈希列表：fetch 失败（如本地 file:// 打开）时使用，仅存哈希不存明文
    var FALLBACK_HASHES = [
      '413b7b3d5700ad8a6b296c9d0e7107dbd7280a985c1c695db8646c278e510224',
      '270b0e42fa470c44d366bde6b47de2225e915e5b274f1c3838682e1ca350532f',
      'cbcf800f235bcba864b3fa23d3fb3cfab8eb3806a5ef2da4e9f84b89d0010ab6',
      'f33f356f0975feb01468d154687a812a113ffa87ac5091ecc99637a552f033e9'
    ];

    function check(phoneHash, hashes){
      var matched = hashes.some(function(h){ return h === phoneHash; });
      loadEl.classList.remove('show');
      btnEl.disabled = false;
      if (matched) {
        unlock(phone);
      } else {
        showErr('输入有误，请重新输入');
        shake();
      }
    }

    // Hash the input, fetch hash list; fallback to embedded list if fetch fails
    sha256(phone).then(function(phoneHash){
      fetch('jiesuo.html').then(function(r){ return r.text(); }).then(function(text){
        var hashes = text.trim().split(/[\n\r]+/).filter(function(h){ return h.trim(); });
        check(phoneHash, hashes);
      }).catch(function(){
        check(phoneHash, FALLBACK_HASHES);
      });
    }).catch(function(){
      loadEl.classList.remove('show');
      btnEl.disabled = false;
      showErr('设备不支持，请更换浏览器');
    });
  };

  function unlock(phone){
    var now = Date.now();
    var expires = now + VALID_MS;
    localStorage.setItem('phone_session', JSON.stringify({
      phone: phone,
      loginAt: now,
      expires: expires
    }));
    if (overlay) {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity .4s';
      setTimeout(function(){ overlay.classList.add('hidden'); overlay.style.opacity = '1'; }, 400);
    }
    scheduleRelock(expires);
  }

  // 有效期结束后重新锁屏（页面停留期间也会触发）
  function relock(){
    relockTimer = null;
    try { localStorage.removeItem('phone_session'); } catch(e) {}
    if (!overlay) return;
    phoneInput.value = '';
    errEl.classList.remove('show');
    overlay.classList.remove('hidden');
    overlay.style.opacity = '1';
    overlay.style.transition = 'none';
    if (phoneInput) phoneInput.focus();
  }

  function scheduleRelock(expires){
    if (relockTimer) { clearTimeout(relockTimer); relockTimer = null; }
    var remain = expires - Date.now();
    if (remain <= 0) { relock(); return; }
    relockTimer = setTimeout(relock, remain);
  }

  function showErr(msg){
    errEl.textContent = msg;
    errEl.classList.add('show');
    setTimeout(function(){ errEl.classList.remove('show'); }, 3000);
  }

  function shake(){
    phoneInput.classList.add('error');
    setTimeout(function(){ phoneInput.classList.remove('error'); }, 400);
  }
})();
</script>

</body>
</html>
