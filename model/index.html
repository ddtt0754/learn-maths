<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=3.0">
<title>模型思维 · 两英豆豆教练</title>
<style>
:root{
  --bg:#f0f4f8;--card:#fff;--text:#1e293b;--text2:#64748b;
  --border:#e2e8f0;--accent:#f59e0b;--accent2:#3b82f6;
  --green:#22c55e;--red:#ef4444;--radius:14px;--shadow:0 2px 12px rgba(0,0,0,.06);
  --p1:#6366f1;--p2:#0891b2;--p3:#ea580c;--p4:#dc2626;--p5:#059669;
  --c1:#7c3aed;--c2:#64748b;--c3:#0ea5e9;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* layout */
.container{max-width:720px;margin:0 auto;padding:14px 16px 90px;display:flex;flex-direction:column;gap:14px}

/* header (绿蓝渐变 + 双圆装饰，与 thinking/calculation 一致) */
.hdr{
  position:relative;
  background:linear-gradient(135deg,#35d29a,#2f9df0);
  border-radius:20px;padding:24px 18px 22px;
  text-align:center;color:#fff;overflow:hidden;
  box-shadow:0 14px 30px rgba(47,157,240,.25);margin-bottom:16px;
}
.hdr::before,.hdr::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hdr::before{width:120px;height:120px;top:-40px;right:-30px}
.hdr::after{width:70px;height:70px;bottom:-24px;left:-16px}
.hdr h1{position:relative;font-size:22px;letter-spacing:1.5px;font-weight:700}
.hdr .sub{position:relative;margin-top:8px;font-size:13px;opacity:.95}

/* back btn */
.back-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;font-size:.8rem;
  background:var(--card);border:1.5px solid var(--border);border-radius:18px;
  color:var(--text);text-decoration:none;font-weight:600;cursor:pointer;margin-bottom:2px}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}

/* 返回首页按钮（底部居中、绿蓝渐变 pill） */
.bt-home{
  display:block;width:fit-content;
  margin:18px auto 8px;padding:11px 26px;
  background:linear-gradient(135deg,#35d29a,#2f9df0);
  color:#fff;border:none;border-radius:999px;
  font-size:14px;font-weight:600;cursor:pointer;
  text-decoration:none;
  box-shadow:0 4px 14px rgba(47,157,240,.22);
  transition:transform .15s,box-shadow .25s;
}
.bt-home:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(47,157,240,.32)}
.bt-home:active{transform:scale(.97)}

/* 板块标题 */
.section-label{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700;color:var(--text);margin:6px 0 -4px;padding-left:4px}
.section-label::before{content:"";width:5px;height:16px;background:linear-gradient(180deg,#35d29a,#2f9df0);border-radius:2.5px}
.section-label .badge{padding:2px 8px;background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;font-size:.7rem;border-radius:10px;margin-left:auto;font-weight:600}

/* 板块:小学/初中卡片 */
.section-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.section-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px 12px;text-align:center;cursor:pointer;border:1.5px solid transparent;
  transition:transform .15s,box-shadow .25s,border-color .2s;
  text-decoration:none;color:inherit;
}
.section-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(47,157,240,.16);border-color:#a7f3d0}
.section-card:active{transform:scale(.97)}
.section-card .ic{font-size:32px;line-height:1}
.section-card .nm{font-size:.95rem;font-weight:700;margin-top:8px}
.section-card .ds{font-size:.7rem;color:var(--text2);margin-top:3px;line-height:1.4;min-height:30px}
.section-card .num{padding:2px 8px;background:#eef2ff;color:var(--p1);font-size:.7rem;font-weight:700;border-radius:8px;margin-top:6px;display:inline-block}
.section-card.placeholder .num{background:#fef3c7;color:#92400e}
.section-card.placeholder{opacity:.85}

/* 专题列表页 */
.topic-detail{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px}
.topic-detail h2{font-size:1.1rem;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.topic-detail .desc{font-size:.85rem;color:var(--text2);line-height:1.6;margin-bottom:10px}

/* 知识点卡片 */
.point-card{background:var(--card);border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.04);
  padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--accent)}
.point-card .pc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.point-card .pc-name{font-size:1rem;font-weight:700;flex:1}
.point-card .pc-level{font-size:.65rem;padding:2px 7px;background:#fef3c7;color:#92400e;border-radius:8px;font-weight:600}
.point-card .pc-desc{font-size:.83rem;color:var(--text2);line-height:1.6;margin-bottom:8px}
.point-card .pc-examples{font-size:.82rem;background:#f8fafc;border-radius:8px;padding:8px 12px;line-height:1.7;margin-bottom:8px}
.point-card .pc-examples b{color:var(--accent)}
.point-card .pc-btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;
  background:var(--accent);color:#fff;border:none;border-radius:18px;font-size:.8rem;font-weight:600;cursor:pointer}
.point-card .pc-btn:hover{background:#d97706}

/* 答题页 */
.q-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 18px}
.q-tag{font-size:.7rem;color:var(--accent2);font-weight:600;margin-bottom:6px}
.q-stem{font-size:.95rem;font-weight:600;line-height:1.8;margin-bottom:14px;white-space:pre-wrap;word-break:break-word}
.answer-row{display:flex;gap:8px;align-items:center}
.answer-row input{flex:1;padding:11px 14px;border:2px solid var(--border);border-radius:10px;font-size:1rem;outline:none;font-family:inherit}
.answer-row input:focus{border-color:var(--accent2)}
.answer-row button{padding:11px 22px;background:var(--accent2);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer}
.answer-row button:disabled{opacity:.5}
.feedback{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:.88rem;font-weight:600;display:none}
.feedback.ok{display:block;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.feedback.err{display:block;background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.feedback .correct-ans{margin-top:4px;font-weight:400;font-size:.82rem}

/* 题号圆点 */
.pagination{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:8px;flex-wrap:wrap}
.page-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .15s}
.page-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.page-btn.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.page-btn.done{background:#d1fae5;border-color:var(--green);color:#065f46}
.page-btn.q-label{font-size:.7rem;color:var(--text2);width:auto;padding:0 6px;border:none;background:transparent;cursor:default}

/* report panel */
.report-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:flex-end;justify-content:center}
.report-overlay.show{display:flex}
.report-panel{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:80vh;overflow-y:auto;padding:24px 20px 30px;box-shadow:0 -4px 20px rgba(0,0,0,.1)}
.report-panel h2{font-size:1.1rem;text-align:center;margin-bottom:12px}
.report-panel .r-stats{display:flex;justify-content:center;gap:30px;margin:12px 0 20px;flex-wrap:wrap}
.report-panel .r-stat{text-align:center}
.report-panel .r-stat .n{font-size:1.6rem;font-weight:800}
.report-panel .r-stat .l{font-size:.7rem;color:var(--text2)}
.report-panel .r-ring{width:80px;height:80px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;color:#fff}
.report-panel .r-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:.82rem}
.report-panel .r-item .r-q{font-weight:600}
.report-panel .r-item .r-a{color:var(--text2);margin-top:2px}
.report-panel .r-item .r-c{color:var(--green);font-weight:600}
.report-panel .r-item .r-w{color:var(--red)}
.report-panel .btn-row{display:flex;gap:10px;justify-content:center;margin-top:16px}
.report-panel .btn-row button{padding:10px 24px;border-radius:8px;border:none;font-size:.9rem;font-weight:600;cursor:pointer}
.r-btn-close{background:var(--bg);color:var(--text)}
.r-btn-retry{background:var(--accent2);color:#fff}

@media(min-width:520px){
  .section-cards{grid-template-columns:repeat(3,1fr)}
}

/* 教练微信号提示框 */
.coach-tip{position:relative;display:inline-block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.coach-tip .tip{visibility:hidden;opacity:0;position:absolute;bottom:145%;left:50%;transform:translateX(-50%) translateY(4px);background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;padding:7px 14px;border-radius:10px;font-size:12.5px;font-weight:700;white-space:nowrap;letter-spacing:.5px;z-index:99;pointer-events:none;box-shadow:0 6px 18px rgba(47,157,240,.35);transition:opacity .2s ease,transform .2s ease,visibility .2s}
.coach-tip .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#2f9df0}
.coach-tip:hover .tip,.coach-tip:active .tip,.coach-tip:focus .tip{visibility:visible;opacity:1;transform:translateX(-50%) translateY(0)}
.coach-footer{text-align:center;padding:14px 0 18px;color:var(--text2,#7f8c8d);font-size:.75rem}


  .more-link{display:flex;align-items:center;justify-content:center;gap:6px;
    margin:18px auto 0;width:fit-content;background:#fff;color:#1fa873;border:1.5px solid #2ebd85;
    padding:12px 28px;border-radius:999px;font-size:14px;font-weight:800;text-decoration:none;
    box-shadow:0 4px 12px rgba(46,158,107,.14);transition:transform .15s;touch-action:manipulation}
  .more-link:active{transform:scale(.95)}


/* ========== 手机号验证锁屏 ========== */
.lock-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(15,23,42,.78); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
.lock-overlay.hidden { display: none; }
.lock-card {
  background: #fff; border-radius: 20px; padding: 32px 28px 24px;
  width: 340px; max-width: 92vw; text-align: center;
  box-shadow: 0 24px 60px rgba(0,0,0,.25); animation: lockIn .35s ease;
}
@keyframes lockIn { from { opacity:0; transform: translateY(20px) scale(.96); } to { opacity:1; transform: translateY(0) scale(1); } }
.lock-card .lock-icon { font-size: 48px; margin-bottom: 6px; }
.lock-card h2 { font-size: 18px; font-weight: 800; color: #1e293b; margin-bottom: 6px; }
.lock-card .lock-desc { font-size: 12px; color: #94a3b8; margin-bottom: 18px; line-height: 1.6; }
.lock-input-row { display: flex; gap: 8px; }
.lock-input-row input {
  flex: 1; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 12px;
  font-size: 16px; outline: none; text-align: center; letter-spacing: 2px;
  font-family: inherit; transition: border-color .2s;
}
.lock-input-row input:focus { border-color: #3b82f6; }
.lock-input-row input.error { border-color: #ef4444; background: #fef2f2; animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.lock-input-row button {
  padding: 12px 22px; background: linear-gradient(135deg,#35d29a,#2f9df0);
  color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
  cursor: pointer; white-space: nowrap; transition: transform .15s;
}
.lock-input-row button:hover { transform: scale(1.03); }
.lock-input-row button:active { transform: scale(.97); }
.lock-input-row button:disabled { opacity: .5; cursor: not-allowed; }
.lock-loading { display: none; margin-top: 10px; font-size: 12px; color: #64748b; }
.lock-loading.show { display: block; }
.lock-error { display: none; margin-top: 10px; padding: 8px 12px; background: #fef2f2;
  color: #dc2626; border-radius: 8px; font-size: 12px; font-weight: 600; }
.lock-error.show { display: block; }
  .lock-hint { margin-top: 12px; font-size: 11px; color: #94a3b8; line-height: 1.6; }
</style>
</head>
<body>
<!-- 手机号验证锁屏 -->
<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <div class="lock-icon">🔐</div>
    <h2>请输入手机号验证</h2>
    <div class="lock-desc">首次访问需验证手机号<br>验证通过后可 7 天内免登录</div>
    <div class="lock-input-row">
      <input type="tel" id="phoneInput" placeholder="输入 11 位手机号" maxlength="11" inputmode="numeric" autofocus>
      <button id="verifyBtn" onclick="verifyPhone()">验证</button>
    </div>
    <div class="lock-loading" id="lockLoading">⏳ 正在验证…</div>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-hint">仅限已登记手机号访问<br>如有疑问请联系两英豆豆教练</div>
  </div>
</div>

<div class="container" id="app"></div>

<script src="topics.js"></script>
<script>
/* ============ 状态 ============ */
var state = { view:'home', topicId:null, pointId:null, qIdx:0, answers:[],
  timerSec:0, timerHandle:null, answered:false };

/* ============ 计时 ============ */
function startTimer(){ if(state.timerHandle)return; state.timerHandle=setInterval(function(){state.timerSec++;updateTimer();},1000); }
function stopTimer(){ clearInterval(state.timerHandle); state.timerHandle=null; }
function resetTimer(){ stopTimer(); state.timerSec=0; updateTimer(); }
function updateTimer(){ var el=document.getElementById('timer'); if(el){ var m=Math.floor(state.timerSec/60),s=state.timerSec%60; el.textContent=m+':'+(s<10?'0':'')+s; } }

/* ============ 路由 ============ */
function render(){
  var app = document.getElementById('app');
  if(state.view==='home') app.innerHTML = renderHome();
  else if(state.view==='topic') app.innerHTML = renderTopic();
  else if(state.view==='point') app.innerHTML = renderPoint();
  bindEvents();
}

/* ============ 主页（板块） ============ */
function renderHome(){
  // 分类板块
  var primary = ['app','xc','js','jh','sl'];
  var middle = ['cz-ds','cz-jh','cz-hs'];
  var pHtml = primary.map(function(k){
    var t = TOPICS[k];
    var n = t.points.length;
    return '<div class="section-card" data-topic="'+k+'">'+
      '<div class="ic">'+t.icon+'</div>'+
      '<div class="nm">'+t.title+'</div>'+
      '<div class="ds">'+t.desc.substring(0,28)+'…</div>'+
      '<span class="num">'+n+' 个知识点</span></div>';
  }).join('');
  var mHtml = middle.map(function(k){
    var t = TOPICS[k];
    return '<div class="section-card placeholder" data-topic="'+k+'">'+
      '<div class="ic">'+t.icon+'</div>'+
      '<div class="nm">'+t.title+'</div>'+
      '<div class="ds">即将上线</div>'+
      '<span class="num">敬请期待</span></div>';
  }).join('');
  // 第 6 个板块：视频课程（外部链接）
  var vHtml = '<a class="section-card" href="../course/Lilaoshi-maths/index.html">'+
    '<div class="ic">📺</div>'+
    '<div class="nm">视频课程</div>'+
    '<div class="ds">小学数学思维课 · 1-4 阶<br>视频精讲 · 随点随播</div>'+
    '<span class="num">106 节视频 →</span></a>';
  // 初中模型 · 经典题库导航（横条卡片）
  var cHtml = '<a href="algebra/7a-topic3.html" style="display:flex;align-items:center;gap:14px;padding:14px 18px;background:#fff;border:1.5px solid #bfdbfe;border-radius:14px;box-shadow:0 4px 12px rgba(47,157,240,.10);text-decoration:none;color:inherit;grid-column:1/-1;margin-bottom:10px">'+
    '<div style="font-size:36px;line-height:1">🔢</div>'+
    '<div style="flex:1">'+
      '<div style="font-size:16px;font-weight:700;color:#0e7490">数列求值专题</div>'+
      '<div style="font-size:12px;color:#64748b;margin-top:4px">七年级上册 · 数列求值 · 经典题库训练</div>'+
    '</div>'+
    '<span style="background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;flex-shrink:0">进入练习 →</span>'+
  '</a>'+
  '<a href="algebra/7a-topic4.html" style="display:flex;align-items:center;gap:14px;padding:14px 18px;background:#fff;border:1.5px solid #bfdbfe;border-radius:14px;box-shadow:0 4px 12px rgba(47,157,240,.10);text-decoration:none;color:inherit;grid-column:1/-1;margin-bottom:10px">'+
    '<div style="font-size:36px;line-height:1">🔢</div>'+
    '<div style="flex:1">'+
      '<div style="font-size:16px;font-weight:700;color:#0e7490">绝对值最值专题</div>'+
      '<div style="font-size:12px;color:#64748b;margin-top:4px">七年级上册 · 绝对值最值 · 经典题库训练</div>'+
    '</div>'+
    '<span style="background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;flex-shrink:0">进入练习 →</span>'+
  '</a>'+
  '<a href="algebra/7a-topic1.html" style="display:flex;align-items:center;gap:14px;padding:14px 18px;background:#fff;border:1.5px solid #bfdbfe;border-radius:14px;box-shadow:0 4px 12px rgba(47,157,240,.10);text-decoration:none;color:inherit;grid-column:1/-1;margin-bottom:10px">'+
    '<div style="font-size:36px;line-height:1">🔢</div>'+
    '<div style="flex:1">'+
      '<div style="font-size:16px;font-weight:700;color:#0e7490">相反数、绝对值专题</div>'+
      '<div style="font-size:12px;color:#64748b;margin-top:4px">七年级上册 · 相反数与绝对值 · 经典题库训练</div>'+
    '</div>'+
    '<span style="background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;flex-shrink:0">进入练习 →</span>'+
  '</a>'+
  '<a href="algebra/7a-topic2.html" style="display:flex;align-items:center;gap:14px;padding:14px 18px;background:#fff;border:1.5px solid #bfdbfe;border-radius:14px;box-shadow:0 4px 12px rgba(47,157,240,.10);text-decoration:none;color:inherit;grid-column:1/-1;margin-bottom:10px">'+
    '<div style="font-size:36px;line-height:1">🔢</div>'+
    '<div style="flex:1">'+
      '<div style="font-size:16px;font-weight:700;color:#0e7490">数轴动点专题</div>'+
      '<div style="font-size:12px;color:#64748b;margin-top:4px">七年级上册 · 数轴动点 · 经典题库训练</div>'+
    '</div>'+
    '<span style="background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;flex-shrink:0">进入练习 →</span>'+
  '</a>'+
  '<a href="algebra/7a-topic5.html" style="display:flex;align-items:center;gap:14px;padding:14px 18px;background:#fff;border:1.5px solid #bfdbfe;border-radius:14px;box-shadow:0 4px 12px rgba(47,157,240,.10);text-decoration:none;color:inherit;grid-column:1/-1;margin-bottom:10px">'+
    '<div style="font-size:36px;line-height:1">🔢</div>'+
    '<div style="flex:1">'+
      '<div style="font-size:16px;font-weight:700;color:#0e7490">进制转化专题</div>'+
      '<div style="font-size:12px;color:#64748b;margin-top:4px">七年级上册 · 二进制·八进制·十进制互转 · 经典题库训练</div>'+
    '</div>'+
    '<span style="background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;flex-shrink:0">进入练习 →</span>'+
  '</a>';

  return ''+
    '<div class="hdr"><h1>🎯 模型思维</h1><p class="sub">小学 · 初中数学模型系统化训练</p></div>'+

/* ============ 专题详情（知识点列表） ============ */
function renderTopic(){
  var t = TOPICS[state.topicId];
  if(!t) return '';
  if(t.points.length===0){
    return '<div><div class="back-btn" onclick="goBack(\'home\')">← 返回主页</div>'+
      '<div class="topic-detail" style="text-align:center;padding:60px 20px">'+
      '<div style="font-size:60px">'+t.icon+'</div>'+
      '<h2 style="justify-content:center;margin:14px 0 8px">'+t.title+'</h2>'+
      '<p style="color:var(--text2);line-height:1.8">'+t.desc+'</p>'+
      '<p style="margin-top:18px;font-size:.85rem;color:#92400e">📌 内容开发中，敬请期待…</p>'+
      '</div></div>';
  }
  var html = '<div><div class="back-btn" onclick="goBack(\'home\')">← 返回主页</div>'+
    '<div class="topic-detail"><h2>'+t.icon+' '+t.title+'</h2><div class="desc">'+t.desc+'</div></div>';
  t.points.forEach(function(p,i){
    var ex = p.examples.map(function(e){return '★ '+e;}).join('<br>');
    html += '<div class="point-card">'+
      '<div class="pc-head"><span class="pc-name">'+(i+1)+'. '+p.name+'</span><span class="pc-level">'+p.level+'</span></div>'+
      '<div class="pc-desc">'+p.desc+'</div>'+
      '<div class="pc-examples"><b>📚 典型例题：</b><br>'+ex+'</div>'+
      '<button class="pc-btn" data-pid="'+p.id+'">✏️ 开始练习（'+p.questions.length+' 题）</button>'+
      '</div>';
  });
  html += '</div>';
  return html;
}

/* ============ 答题页 ============ */
function renderPoint(){
  var t = TOPICS[state.topicId], p;
  for(var i=0;i<t.points.length;i++) if(t.points[i].id===state.pointId){p=t.points[i];break;}
  if(!p) return '';
  state.answered = false;
  var total = p.questions.length;
  var q = p.questions[state.qIdx];
  var pages = '';
  for(var i=0;i<total;i++){
    var ans = state.answers.filter(function(a){return a.point===state.pointId&&a.qIdx===i;}).pop();
    var cls = 'page-btn'+(i===state.qIdx?' active':'')+(ans?' done':'');
    pages += '<span class="page-btn '+cls+'" data-qi="'+i+'">'+(i+1)+'</span>';
  }
  return '<div><div class="back-btn" onclick="goBack(\'topic\')">← 返回 '+t.title+'</div>'+
    '<div class="topic-detail" style="padding:14px 16px"><h2 style="font-size:1rem">📌 '+p.name+'</h2>'+
    '<div class="desc">'+p.desc+'</div></div>'+
    '<div class="q-card">'+
      '<div class="q-tag">📝 第 '+(state.qIdx+1)+' / '+total+' 题</div>'+
      '<div class="q-stem">'+q.stem+'</div>'+
      '<div class="answer-row"><input id="answerInput" type="text" placeholder="'+q.hint+'" autocomplete="off" inputmode="text">'+
      '<button id="btnSubmit">确认</button></div>'+
      '<div class="feedback" id="feedback"></div>'+
    '</div>'+
    '<div class="pagination">'+pages+'<span class="page-btn q-label">'+total+'题</span></div>'+
    '</div>';
}

/* ============ 事件 ============ */
function bindEvents(){
  // 主页 → 专题
  document.querySelectorAll('.section-card[data-topic]').forEach(function(el){
    el.addEventListener('click',function(){
      state.topicId = this.dataset.topic;
      state.view = 'topic';
      state.answers = state.answers.filter(function(a){return a.topic===state.topicId;});
      resetTimer(); render();
    });
  });
  // 知识点 → 练习
  document.querySelectorAll('.pc-btn[data-pid]').forEach(function(el){
    el.addEventListener('click',function(){
      state.pointId = this.dataset.pid;
      state.qIdx = 0;
      state.view = 'point';
      state.answered = false;
      resetTimer(); render();
      setTimeout(function(){var i=document.getElementById('answerInput');if(i){i.focus();startTimer();}},100);
    });
  });
  // 题号
  document.querySelectorAll('.page-btn[data-qi]').forEach(function(el){
    el.addEventListener('click',function(){
      state.qIdx = parseInt(this.dataset.qi);
      state.answered = false;
      render();
      setTimeout(function(){var i=document.getElementById('answerInput');if(i)i.focus();},80);
    });
  });
  // 提交
  var btn = document.getElementById('btnSubmit');
  if(btn){
    btn.addEventListener('click',submitAnswer);
    document.getElementById('answerInput').addEventListener('keydown',function(e){
      if(e.key==='Enter')submitAnswer();
    });
  }
}
function goBack(to){
  if(to==='home'){
    state.view='home'; state.topicId=null; state.pointId=null; state.qIdx=0;
    resetTimer(); render();
  } else if(to==='topic'){
    state.view='topic'; state.pointId=null; state.qIdx=0;
    resetTimer(); render();
  }
}

/* ============ 判分 ============ */
function submitAnswer(){
  if(state.answered) return;
  var input = document.getElementById('answerInput').value.trim();
  var t = TOPICS[state.topicId], p;
  for(var i=0;i<t.points.length;i++) if(t.points[i].id===state.pointId){p=t.points[i];break;}
  var q = p.questions[state.qIdx];
  var correct = false;
  if(q.type==='int'){
    var num = parseInt(input);
    correct = !isNaN(num) && num === q.ans;
  } else if(q.type==='decimal'){
    var num2 = parseFloat(input);
    correct = !isNaN(num2) && Math.abs(num2 - q.ans) < 0.01;
  } else {
    correct = input.replace(/\s/g,'').toLowerCase() === String(q.ans).replace(/\s/g,'').toLowerCase();
  }
  state.answered = true;
  var fb = document.getElementById('feedback');
  if(correct){
    fb.className='feedback ok';
    fb.innerHTML='✅ 回答正确！';
  } else {
    fb.className='feedback err';
    fb.innerHTML='❌ 不正确<div class="correct-ans">正确答案：<b>'+esc(q.ans)+'</b></div>';
  }
  document.getElementById('answerInput').disabled=true;
  document.getElementById('btnSubmit').disabled=true;
  state.answers.push({topic:state.topicId,point:state.pointId,qIdx:state.qIdx,correct:correct,user:input,time:state.timerSec});
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* ============ 报告 ============ */
function showReport(){
  stopTimer();
  var t = TOPICS[state.topicId], p;
  for(var i=0;i<t.points.length;i++) if(t.points[i].id===state.pointId){p=t.points[i];break;}
  var all = p.questions.map(function(_,i){
    return state.answers.filter(function(a){return a.point===state.pointId&&a.qIdx===i;}).pop() || {correct:false,user:''};
  });
  var score = all.filter(function(a){return a.correct;}).length, total = all.length;
  var pct = Math.round(score/total*100);
  var color = pct>=80?'#22c55e':pct>=60?'#f59e0b':'#ef4444';
  var items = '';
  all.forEach(function(a,i){
    items += '<div class="r-item"><div class="r-q">'+(i+1)+'. '+p.questions[i].stem+'</div>'+
      '<div class="r-a">你的答案：'+esc(a.user||'（未作答）')+'　正确答案：<b>'+esc(p.questions[i].ans)+'</b>'+
      (a.correct?' <span class="r-c">✓</span>':' <span class="r-w">✗</span>')+'</div></div>';
  });
  var overlay = document.createElement('div');overlay.className='report-overlay show';overlay.id='reportOverlay';
  overlay.innerHTML = '<div class="report-panel"><div class="r-ring" style="background:'+color+'">'+pct+'%</div>'+
    '<h2>练习报告 · '+p.name+'</h2>'+
    '<div class="r-stats"><div class="r-stat"><div class="n">'+total+'</div><div class="l">总题数</div></div>'+
    '<div class="r-stat"><div class="n">'+score+'</div><div class="l">正确</div></div>'+
    '<div class="r-stat"><div class="n">'+(total-score)+'</div><div class="l">错误</div></div>'+
    '<div class="r-stat"><div class="n">'+Math.floor(state.timerSec/60)+':'+String(state.timerSec%60).padStart(2,'0')+'</div><div class="l">用时</div></div></div>'+
    '<div style="max-height:200px;overflow-y:auto;margin-bottom:12px">'+items+'</div>'+
    '<div class="btn-row"><button class="r-btn-close" onclick="closeReport()">关闭</button>'+
    '<button class="r-btn-retry" onclick="retryPoint()">🔄 再练一次</button></div></div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click',function(e){if(e.target===overlay)closeReport();});
}

function closeReport(){
  var el=document.getElementById('reportOverlay'); if(el)el.remove();
  stopTimer(); resetTimer(); render();
}
function retryPoint(){
  // 复用当前题目（数据已固化）；用户要求换题改用通用方法
  state.answers = state.answers.filter(function(a){return a.point!==state.pointId;});
  state.qIdx = 0;
  resetTimer(); render();
}
function nextQ(){
  if(state.view!=='point') return;
  var t = TOPICS[state.topicId], p;
  for(var i=0;i<t.points.length;i++) if(t.points[i].id===state.pointId){p=t.points[i];break;}
  if(state.qIdx+1 < p.questions.length){ state.qIdx++; render(); }
  else showReport();
}

/* ============ 初始化 ============ */
render();
</script>

<script>
(function(){
  var overlay = document.getElementById('lockOverlay');
  var phoneInput = document.getElementById('phoneInput');
  var errEl = document.getElementById('lockError');
  var loadEl = document.getElementById('lockLoading');
  var btnEl = document.getElementById('verifyBtn');

  // 有效期 7 天
  var VALID_MS = 7 * 24 * 60 * 60 * 1000;
  var relockTimer = null;

  // Enter 键提交（始终绑定，保证重新锁屏后也能用）
  if (phoneInput) {
    phoneInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter') verifyPhone();
    });
  }
  window.verifyPhone = verifyPhone;

  // Check existing session (1 minute)
  var session = null;
  try { session = JSON.parse(localStorage.getItem('phone_session')); } catch(e) {}
  if (session && session.expires && Date.now() < session.expires) {
    if (overlay) overlay.classList.add('hidden');
    scheduleRelock(session.expires);
    return;
  }

  // Show overlay
  if (overlay) overlay.classList.remove('hidden');
  if (phoneInput) phoneInput.focus();

  // SHA-256 hash phone, fetch hash list, compare
  function sha256(str){
    var encoder = new TextEncoder();
    return crypto.subtle.digest('SHA-256', encoder.encode(str))
      .then(function(buf){
        return Array.from(new Uint8Array(buf))
          .map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      });
  }

  function verifyPhone(){
    var phone = phoneInput.value.replace(/\s+/g, '');
    if (!phone) { showErr('请输入手机号'); shake(); return; }
    if (!/^1\d{10}$/.test(phone)) { showErr('请输入正确的 11 位手机号'); shake(); return; }

    btnEl.disabled = true;
    loadEl.classList.add('show');
    errEl.classList.remove('show');
    phoneInput.classList.remove('error');

    // 兜底哈希列表：fetch 失败（如本地 file:// 打开）时使用，仅存哈希不存明文
    var FALLBACK_HASHES = [
      '413b7b3d5700ad8a6b296c9d0e7107dbd7280a985c1c695db8646c278e510224',
      '679d49b6e57d426b2af961461512559700b9e4c01aa723f0b71682c5f07b31c3',
      'df225757a3ffcac2bd9643323af99631a53300b439da8ff4a8a41f889ce39704',
      'f33f356f0975feb01468d154687a812a113ffa87ac5091ecc99637a552f033e9',
    ];

    function check(phoneHash, hashes){
      var matched = hashes.some(function(h){ return h === phoneHash; });
      loadEl.classList.remove('show');
      btnEl.disabled = false;
      if (matched) {
        unlock(phone);
      } else {
        showErr('输入有误，请重新输入');
        shake();
      }
    }

    // Hash the input, fetch hash list; fallback to embedded list if fetch fails
    sha256(phone).then(function(phoneHash){
      fetch('../jiesuo.html').then(function(r){ return r.text(); }).then(function(text){
        var hashes = text.trim().split(/[\n\r]+/).filter(function(h){ return h.trim(); });
        check(phoneHash, hashes);
      }).catch(function(){
        check(phoneHash, FALLBACK_HASHES);
      });
    }).catch(function(){
      loadEl.classList.remove('show');
      btnEl.disabled = false;
      showErr('设备不支持，请更换浏览器');
    });
  };

  function unlock(phone){
    var now = Date.now();
    var expires = now + VALID_MS;
    localStorage.setItem('phone_session', JSON.stringify({
      phone: phone,
      loginAt: now,
      expires: expires
    }));
    if (overlay) {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity .4s';
      setTimeout(function(){ overlay.classList.add('hidden'); overlay.style.opacity = '1'; }, 400);
    }
    scheduleRelock(expires);
  }

  // 有效期结束后重新锁屏（页面停留期间也会触发）
  function relock(){
    relockTimer = null;
    try { localStorage.removeItem('phone_session'); } catch(e) {}
    if (!overlay) return;
    phoneInput.value = '';
    errEl.classList.remove('show');
    overlay.classList.remove('hidden');
    overlay.style.opacity = '1';
    overlay.style.transition = 'none';
    if (phoneInput) phoneInput.focus();
  }

  function scheduleRelock(expires){
    if (relockTimer) { clearTimeout(relockTimer); relockTimer = null; }
    var remain = expires - Date.now();
    if (remain <= 0) { relock(); return; }
    relockTimer = setTimeout(relock, remain);
  }

  function showErr(msg){
    errEl.textContent = msg;
    errEl.classList.add('show');
    setTimeout(function(){ errEl.classList.remove('show'); }, 3000);
  }

  function shake(){
    phoneInput.classList.add('error');
    setTimeout(function(){ phoneInput.classList.remove('error'); }, 400);
  }
})();
</script>
