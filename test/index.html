<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>学期诊断 · 漏洞统计</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#2ebd85;--b:#2f9df0;--t:#33434b;--l:#8aa09a;--r:16px}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#eefaf4,#eef4fb);color:var(--t);
  padding:24px 16px 60px;min-height:100vh;display:flex;justify-content:center}
.wrap{width:100%;max-width:680px}
.hdr{position:relative;background:linear-gradient(135deg,#35d29a,#2f9df0);
  border-radius:22px;padding:30px 20px 26px;text-align:center;color:#fff;overflow:hidden;
  box-shadow:0 14px 30px rgba(47,157,240,.25);margin-bottom:18px}
.hdr::before,.hdr::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hdr::before{width:120px;height:120px;top:-40px;right:-30px}
.hdr::after{width:70px;height:70px;bottom:-24px;left:-16px}
.hdr h1{position:relative;font-size:24px;letter-spacing:3px;font-weight:700}
.hdr .sub{position:relative;margin-top:10px;font-size:13px;letter-spacing:2px;opacity:.92}
.top-btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.top-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;
  background:rgba(255,255,255,.20);border:1.5px solid rgba(255,255,255,.85);color:#fff;
  border-radius:999px;font-size:13.5px;font-weight:600;text-decoration:none;cursor:pointer}

.card{background:#fff;border-radius:var(--r);padding:18px 20px;margin-bottom:14px;
  box-shadow:0 6px 18px rgba(47,157,240,.08)}
.card-title{font-size:1.05rem;font-weight:700;color:#0e7490;margin-bottom:12px;
  display:flex;align-items:center;gap:8px}
.card-title::before{content:"";width:4px;height:18px;background:linear-gradient(180deg,#35d29a,#2f9df0);border-radius:2px}

/* semester */
.grade-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.grade-btn{padding:10px 6px;border:2px solid #d8ebe3;border-radius:12px;background:#fff;
  font-size:.85rem;font-weight:600;color:var(--t);cursor:pointer;text-align:center;transition:all .15s}
.grade-btn:hover{border-color:var(--b)}
.grade-btn.sel{background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;border-color:transparent}
.sem-row{display:flex;gap:8px}
.sem-btn{flex:1;padding:11px;border:2px solid #d8ebe3;border-radius:12px;background:#fff;
  font-size:.95rem;font-weight:600;color:var(--t);cursor:pointer;text-align:center;transition:all .15s}
.sem-btn:hover{border-color:var(--b)}
.sem-btn.sel{background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;border-color:transparent}

/* difficulty A/B */
.ab-row{display:flex;gap:12px}
.ab-card{flex:1;padding:24px 16px;border:2px solid #d8ebe3;border-radius:16px;background:#fff;
  text-align:center;cursor:pointer;transition:all .2s}
.ab-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(47,157,240,.16)}
.ab-card .ic{font-size:44px;line-height:1;margin-bottom:8px}
.ab-card .nm{font-size:1.15rem;font-weight:700;margin-bottom:4px}
.ab-card .ds{font-size:12px;color:var(--l);line-height:1.5}
.ab-card.a{background:linear-gradient(180deg,#f0fdf4,#fff);border-color:#bbf7d0}
.ab-card.a:hover{border-color:#22c55e}
.ab-card.a.sel{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-color:#22c55e;border-width:3px;box-shadow:0 4px 16px rgba(34,197,94,.15)}
.ab-card.b{background:linear-gradient(180deg,#fff7ed,#fff);border-color:#fed7aa}
.ab-card.b:hover{border-color:#f97316}
.ab-card.b.sel{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#f97316;border-width:3px;box-shadow:0 4px 16px rgba(249,115,22,.15)}

/* info + start btn */
.info{text-align:center;padding:14px;background:#f0f9ff;border-radius:12px;
  font-size:14px;color:#0e7490;margin-bottom:6px}
.info b{font-weight:700;color:#0369a1}

.start-btn{display:block;width:100%;padding:16px;margin:10px 0 6px;
  background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;border:none;
  border-radius:16px;font-size:1.15rem;font-weight:700;cursor:pointer;
  box-shadow:0 8px 22px rgba(47,157,240,.28);
  transition:transform .15s,box-shadow .25s}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(47,157,240,.36)}
.start-btn:active{transform:scale(.97)}

.bt-home{display:block;width:fit-content;margin:18px auto 8px;padding:11px 26px;
  background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;border:none;
  border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;
  text-decoration:none;box-shadow:0 4px 14px rgba(47,157,240,.22)}
.ft{text-align:center;padding:8px 0 14px;font-size:12px;color:#a8bcb4}

/* 教练微信号提示框 */
.coach-tip{position:relative;display:inline-block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.coach-tip .tip{visibility:hidden;opacity:0;position:absolute;bottom:145%;left:50%;transform:translateX(-50%) translateY(4px);background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;padding:7px 14px;border-radius:10px;font-size:12.5px;font-weight:700;white-space:nowrap;letter-spacing:.5px;z-index:99;pointer-events:none;box-shadow:0 6px 18px rgba(47,157,240,.35);transition:opacity .2s ease,transform .2s ease,visibility .2s}
.coach-tip .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#2f9df0}
.coach-tip:hover .tip,.coach-tip:active .tip,.coach-tip:focus .tip{visibility:visible;opacity:1;transform:translateX(-50%) translateY(0)}
.coach-footer{text-align:center;padding:14px 0 18px;color:var(--text2,#7f8c8d);font-size:.75rem}


/* ========== 手机号验证锁屏 ========== */
.lock-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(15,23,42,.78); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
.lock-overlay.hidden { display: none; }
.lock-card {
  background: #fff; border-radius: 20px; padding: 32px 28px 24px;
  width: 340px; max-width: 92vw; text-align: center;
  box-shadow: 0 24px 60px rgba(0,0,0,.25); animation: lockIn .35s ease;
}
@keyframes lockIn { from { opacity:0; transform: translateY(20px) scale(.96); } to { opacity:1; transform: translateY(0) scale(1); } }
.lock-card .lock-icon { font-size: 48px; margin-bottom: 6px; }
.lock-card h2 { font-size: 18px; font-weight: 800; color: #1e293b; margin-bottom: 6px; }
.lock-card .lock-desc { font-size: 12px; color: #94a3b8; margin-bottom: 18px; line-height: 1.6; }
.lock-input-row { display: flex; gap: 8px; }
.lock-input-row input {
  flex: 1; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 12px;
  font-size: 16px; outline: none; text-align: center; letter-spacing: 2px;
  font-family: inherit; transition: border-color .2s;
}
.lock-input-row input:focus { border-color: #3b82f6; }
.lock-input-row input.error { border-color: #ef4444; background: #fef2f2; animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.lock-input-row button {
  padding: 12px 22px; background: linear-gradient(135deg,#35d29a,#2f9df0);
  color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
  cursor: pointer; white-space: nowrap; transition: transform .15s;
}
.lock-input-row button:hover { transform: scale(1.03); }
.lock-input-row button:active { transform: scale(.97); }
.lock-input-row button:disabled { opacity: .5; cursor: not-allowed; }
.lock-loading { display: none; margin-top: 10px; font-size: 12px; color: #64748b; }
.lock-loading.show { display: block; }
.lock-error { display: none; margin-top: 10px; padding: 8px 12px; background: #fef2f2;
  color: #dc2626; border-radius: 8px; font-size: 12px; font-weight: 600; }
.lock-error.show { display: block; }
  .lock-hint { margin-top: 12px; font-size: 11px; color: #94a3b8; line-height: 1.6; }
</style>
</head>
<body>
<!-- 手机号验证锁屏 -->
<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <div class="lock-icon">🔐</div>
    <h2>请输入手机号验证</h2>
    <div class="lock-desc">首次访问需验证手机号<br>验证通过后可 7 天内免登录</div>
    <div class="lock-input-row">
      <input type="tel" id="phoneInput" placeholder="输入 11 位手机号" maxlength="11" inputmode="numeric" autofocus>
      <button id="verifyBtn" onclick="verifyPhone()">验证</button>
    </div>
    <div class="lock-loading" id="lockLoading">⏳ 正在验证…</div>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-hint">仅限已登记手机号访问<br>如有疑问请联系两英豆豆教练</div>
  </div>
</div>
<div class="wrap">

<header class="hdr">
  <h1>&#x1fa7a; 学期诊断</h1>
  <p class="sub">智能测评 · 精准定位薄弱环节</p>
  <div class="top-btns">
    <a class="top-btn" href="../classic/index.html">📐经典题库</a>
    <a class="top-btn" href="https://www.jyeoo.com/eval">&#x1f4da; 菁优测评</a>
  </div>
</header>

<div class="card">
  <div class="card-title">1. 选择学期</div>
  <div class="grade-grid" id="gradeGrid"></div>
  <div class="sem-row" id="semRow"></div>
</div>

<div class="card">
  <div class="card-title">2. 选择难度</div>
  <div class="ab-row">
    <div class="ab-card a sel" id="cardA">
      <div class="ic">&#x1f4d6;</div>
      <div class="nm">中等A卷</div>
      <div class="ds">基础达标 · 课内巩固<br>适合大多数同学</div>
    </div>
    <div class="ab-card b" id="cardB">
      <div class="ic">&#x1f4d7;</div>
      <div class="nm">偏高B卷</div>
      <div class="ds">拔高强化 · 思维拓展<br>适合学有余力的同学</div>
    </div>
  </div>
</div>

<div class="info" id="examInfo">
  💡 <b id="infoLine">三年级上册 · 中等A卷</b>
</div>

<button class="start-btn" id="btnStart">&#x25b6; 开始测试</button>
<p style="text-align:center;font-size:12px;color:var(--l);margin-bottom:4px">满分 100 分 · 测试完成出具 AI 诊断报告</p>

<a class="bt-home" href="../index.html">&#x1f3e0; 返回首页</a>
<div class="ft">&copy; <span class="coach-tip" tabindex="0">两英豆豆教练<span class="tip">微信号 ddtt0754</span></span></div>

</div>

<script>
var grade=3, sem='a', difficulty='a';
var NAMES = {2:'二',3:'三',4:'四',5:'五',6:'六',7:'七',8:'八',9:'九'};

function renderGradeGrid(){
  var h='';
  for(var g=2;g<=9;g++){
    h += '<button class="grade-btn'+(g===grade?' sel':'')+'" data-g="'+g+'">'+NAMES[g]+'年级</button>';
  }
  document.getElementById('gradeGrid').innerHTML = h;
}
function renderSemRow(){
  var h='';
  h += '<button class="sem-btn'+('a'===sem?' sel':'')+'" data-s="a">上册</button>';
  h += '<button class="sem-btn'+('b'===sem?' sel':'')+'" data-s="b">下册</button>';
  document.getElementById('semRow').innerHTML = h;
}

function updateInfo(){
  var sn = NAMES[grade]+'年级'+(sem==='a'?'上册':'下册');
  var dn = difficulty==='a'?'中等A卷':'偏高B卷';
  document.getElementById('infoLine').textContent = sn+' · '+dn;
}

// Click handlers via delegation
document.addEventListener('click', function(e){
  var el = e.target;
  // grade button
  if(el.classList.contains('grade-btn') && el.dataset.g){
    grade = parseInt(el.dataset.g);
    renderGradeGrid();
    updateInfo();
    return;
  }
  // sem button
  if(el.classList.contains('sem-btn') && el.dataset.s){
    sem = el.dataset.s;
    renderSemRow();
    updateInfo();
    return;
  }
  // A card
  if(el.closest('#cardA')){
    difficulty = 'a';
    document.getElementById('cardA').classList.add('sel');
    document.getElementById('cardB').classList.remove('sel');
    updateInfo();
    return;
  }
  // B card
  if(el.closest('#cardB')){
    difficulty = 'b';
    document.getElementById('cardB').classList.add('sel');
    document.getElementById('cardA').classList.remove('sel');
    updateInfo();
    return;
  }
});

// Start button
document.getElementById('btnStart').addEventListener('click', function(){
  var code = grade + sem;
  // Route: A卷 (difficulty='a') → exam-{semester}.html, B卷 → exam-{semester}-b.html
  // Currently only 三年级上册 (3a) has real content
  if(code !== '3a'){
    alert('当前仅三年级上册已完善，为您跳转至三年级上册'+ (difficulty==='a'?'A卷':'B卷') +'。');
    code = '3a';
  }
  var file = 'exam-' + code + (difficulty==='b' ? '-b' : '') + '.html';
  // For now, B卷 file is exam-3b.html (same as sem-independent name)
  if(difficulty==='b'){
    file = 'exam-3b.html';
  }
  window.location.href = file;
});

// Init
renderGradeGrid();
renderSemRow();
updateInfo();
</script>
<script>
(function(){
  var overlay = document.getElementById('lockOverlay');
  var phoneInput = document.getElementById('phoneInput');
  var errEl = document.getElementById('lockError');
  var loadEl = document.getElementById('lockLoading');
  var btnEl = document.getElementById('verifyBtn');

  // 有效期 7 天
  var VALID_MS = 7 * 24 * 60 * 60 * 1000;
  var relockTimer = null;

  // Enter 键提交（始终绑定，保证重新锁屏后也能用）
  if (phoneInput) {
    phoneInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter') verifyPhone();
    });
  }
  window.verifyPhone = verifyPhone;

  // Check existing session (1 minute)
  var session = null;
  try { session = JSON.parse(localStorage.getItem('phone_session')); } catch(e) {}
  if (session && session.expires && Date.now() < session.expires) {
    if (overlay) overlay.classList.add('hidden');
    scheduleRelock(session.expires);
    return;
  }

  // Show overlay
  if (overlay) overlay.classList.remove('hidden');
  if (phoneInput) phoneInput.focus();

  // SHA-256 hash phone, fetch hash list, compare
  function sha256(str){
    var encoder = new TextEncoder();
    return crypto.subtle.digest('SHA-256', encoder.encode(str))
      .then(function(buf){
        return Array.from(new Uint8Array(buf))
          .map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      });
  }

  function verifyPhone(){
    var phone = phoneInput.value.replace(/\s+/g, '');
    if (!phone) { showErr('请输入手机号'); shake(); return; }
    if (!/^1\d{10}$/.test(phone)) { showErr('请输入正确的 11 位手机号'); shake(); return; }

    btnEl.disabled = true;
    loadEl.classList.add('show');
    errEl.classList.remove('show');
    phoneInput.classList.remove('error');

    // 兜底哈希列表：fetch 失败（如本地 file:// 打开）时使用，仅存哈希不存明文
    var FALLBACK_HASHES = [
      '413b7b3d5700ad8a6b296c9d0e7107dbd7280a985c1c695db8646c278e510224',
      '679d49b6e57d426b2af961461512559700b9e4c01aa723f0b71682c5f07b31c3',
      'df225757a3ffcac2bd9643323af99631a53300b439da8ff4a8a41f889ce39704',
      'f33f356f0975feb01468d154687a812a113ffa87ac5091ecc99637a552f033e9',
    ];

    function check(phoneHash, hashes){
      var matched = hashes.some(function(h){ return h === phoneHash; });
      loadEl.classList.remove('show');
      btnEl.disabled = false;
      if (matched) {
        unlock(phone);
      } else {
        showErr('输入有误，请重新输入');
        shake();
      }
    }

    // Hash the input, fetch hash list; fallback to embedded list if fetch fails
    sha256(phone).then(function(phoneHash){
      fetch('../jiesuo.html').then(function(r){ return r.text(); }).then(function(text){
        var hashes = text.trim().split(/[\n\r]+/).filter(function(h){ return h.trim(); });
        check(phoneHash, hashes);
      }).catch(function(){
        check(phoneHash, FALLBACK_HASHES);
      });
    }).catch(function(){
      loadEl.classList.remove('show');
      btnEl.disabled = false;
      showErr('设备不支持，请更换浏览器');
    });
  };

  function unlock(phone){
    var now = Date.now();
    var expires = now + VALID_MS;
    localStorage.setItem('phone_session', JSON.stringify({
      phone: phone,
      loginAt: now,
      expires: expires
    }));
    if (overlay) {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity .4s';
      setTimeout(function(){ overlay.classList.add('hidden'); overlay.style.opacity = '1'; }, 400);
    }
    scheduleRelock(expires);
  }

  // 有效期结束后重新锁屏（页面停留期间也会触发）
  function relock(){
    relockTimer = null;
    try { localStorage.removeItem('phone_session'); } catch(e) {}
    if (!overlay) return;
    phoneInput.value = '';
    errEl.classList.remove('show');
    overlay.classList.remove('hidden');
    overlay.style.opacity = '1';
    overlay.style.transition = 'none';
    if (phoneInput) phoneInput.focus();
  }

  function scheduleRelock(expires){
    if (relockTimer) { clearTimeout(relockTimer); relockTimer = null; }
    var remain = expires - Date.now();
    if (remain <= 0) { relock(); return; }
    relockTimer = setTimeout(relock, remain);
  }

  function showErr(msg){
    errEl.textContent = msg;
    errEl.classList.add('show');
    setTimeout(function(){ errEl.classList.remove('show'); }, 3000);
  }

  function shake(){
    phoneInput.classList.add('error');
    setTimeout(function(){ phoneInput.classList.remove('error'); }, 400);
  }
})();
</script>

</body></html>
