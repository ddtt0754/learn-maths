<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=3.0">
<title>计算专项训练 · 九阶分阶</title>
<style>
/* ============================================================
 * styles.css —— 计算专项训练 H5
 * 设计目标：A4 可打印 + 移动端友好 + 浅色清爽
 * ============================================================ */
:root {
  --bg: #f8f9fb;
  --card: #ffffff;
  --text: #1e293b;
  --text2: #64748b;
  --border: #e2e8f0;
  --accent1: #3b82f6;
  --accent2: #22c55e;
  --danger: #ef4444;
  --amber: #f59e0b;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,.06);
  --a4-width: 794px;
  --a4-min-h: 1123px;
  --page-pad: 24px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.7;
  min-height: 100vh;
}

/* ---------- 容器：屏幕模式下居中为 A4 宽 ---------- */
.container {
  max-width: var(--a4-width);
  margin: 0 auto;
  padding: 20px var(--page-pad);
  min-height: 100vh;
}

/* ---------- Header (绿蓝渐变 + 双圆装饰，与 thinking 一致) ---------- */
.hdr {
  position: relative;
  background: linear-gradient(135deg, #35d29a, #2f9df0);
  border-radius: 20px; padding: 24px 18px 22px;
  text-align: center; color: #fff; overflow: hidden;
  box-shadow: 0 14px 30px rgba(47, 157, 240, .25); margin-bottom: 16px;
}
.hdr::before, .hdr::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .14); }
.hdr::before { width: 120px; height: 120px; top: -40px; right: -30px; }
.hdr::after { width: 70px; height: 70px; bottom: -24px; left: -16px; }
.hdr h1 { position: relative; font-size: 22px; letter-spacing: 1.5px; font-weight: 700; }
.hdr h1 .sub, .hdr .sub { position: relative; margin-top: 8px; font-size: 13px; opacity: .95; display: block; font-weight: 400; }
.hdr .badge { position: relative; display: inline-block; margin-top: 10px; font-size: 12px; background: rgba(255, 255, 255, .22); color: #fff; padding: 5px 14px; border-radius: 999px; font-weight: 600; letter-spacing: .5px; }

/* ---------- 玻璃质感按钮（用于 hdr 内右上角） ---------- */
.btn-glass {
  background: rgba(255, 255, 255, .22);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, .35);
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s, transform .15s;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.btn-glass:hover { background: rgba(255, 255, 255, .38); transform: translateY(-1px); }
.btn-glass:active { transform: scale(.96); }
.btn-glass.btn-sm { padding: 5px 12px; font-size: 11.5px; }

/* ---------- Stage Card Grid ---------- */
.stage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.stage-card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px; cursor: pointer; transition: transform .15s, box-shadow .15s;
  border-left: 5px solid transparent; position: relative; overflow: hidden;
}
.stage-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.1); }
.stage-card .stage-icon {
  font-size: 2.2rem; font-weight: 800; margin-bottom: 8px;
}
.stage-card .stage-name { font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
.stage-card .stage-grade { font-size: .72rem; color: var(--text2); margin-bottom: 4px; }
.stage-card .stage-desc { font-size: .78rem; color: var(--text2); }
.stage-card .stage-star {
  margin-top: 10px; font-size: .78rem; color: var(--amber);
}
.stage-card .stage-star i { color: #e2e8f0; }
.stage-card.locked { opacity: .55; cursor: not-allowed; }
.stage-card.locked:hover { transform: none; box-shadow: var(--shadow); }

/* ---------- 考试页 ---------- */
.quiz-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
}
.quiz-topbar .meta { font-size: .85rem; color: var(--text2); }
.quiz-topbar .meta strong { color: var(--text); }

.progress-bar {
  height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 24px; overflow: hidden;
}
.progress-bar .fill {
  height: 100%; background: var(--accent1); border-radius: 3px;
  transition: width .3s ease;
}

/* 每道题是一张卡片 */
.q-page {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 28px 32px; margin-bottom: 24px;
  min-height: calc(var(--a4-min-h) - 80px);
  position: relative;
  page-break-inside: avoid;
}
.q-page .q-tag {
  display: inline-block; font-size: .72rem; background: #eff6ff; color: var(--accent1);
  padding: 3px 12px; border-radius: 20px; margin-bottom: 16px; font-weight: 600;
}
.q-page .q-stem {
  font-size: 1.5rem; font-weight: 700; line-height: 2; margin-bottom: 28px;
  word-break: break-all;
}
.q-page .q-stem .blank {
  display: inline-block; border-bottom: 2px dashed var(--accent1);
  min-width: 3em; text-align: center; margin: 0 4px;
}

/* ---------- 填空答题区 ---------- */
.answer-area { margin-bottom: 20px; }
.fill-label { display: block; font-size: .88rem; font-weight: 600; margin-bottom: 10px; color: var(--text); }
.fill-hint { font-size: .78rem; color: var(--text2); font-weight: 400; margin-left: 6px; }
.fill-row { display: flex; gap: 10px; align-items: center; }
.fill-input {
  flex: 1; padding: 14px 18px; border: 2px solid var(--border); border-radius: 10px;
  font-size: 1.15rem; font-family: inherit; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.fill-input:focus { border-color: var(--accent1); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
.fill-input:disabled { background: #f1f5f9; cursor: not-allowed; }
.fill-btn { padding: 14px 28px; flex-shrink: 0; }
.fill-btn:disabled { opacity: .5; cursor: not-allowed; }
.fill-feedback { margin-top: 14px; padding: 12px 18px; border-radius: 8px; font-size: .95rem; font-weight: 600; display: none; }
.fill-feedback.fb-ok { display: block; background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
.fill-feedback.fb-err { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
.fill-feedback .fb-correct { font-weight: 400; font-size: .9rem; margin-top: 4px; display: inline-block; }
.fb-correct b { color: var(--accent2); }

/* 解析区 */
.explain-box {
  margin-top: 20px; padding: 20px; border-radius: 10px;
  background: #fefce8; border: 1px solid #fde047;
  display: none;
}
.explain-box.show { display: block; }
.explain-box .ex-title { font-weight: 700; font-size: .95rem; margin-bottom: 8px; color: #92400e; }
.explain-box .ex-line { font-size: .92rem; margin-bottom: 4px; }
.explain-box .ex-tip {
  margin-top: 10px; padding: 8px 14px; background: #fef9c3; border-radius: 6px;
  font-size: .82rem; color: #713f12; border-left: 3px solid var(--amber);
}
.explain-box sup { font-size: .75em; }

/* 下一题 */
.next-area { text-align: center; margin-top: 20px; display: none; }
.next-area.show { display: block; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 12px 32px; border: none; border-radius: 8px;
  font-size: 1rem; font-weight: 600; cursor: pointer;
  transition: all .15s; text-decoration: none;
}
.btn-primary { background: var(--accent1); color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-success { background: var(--accent2); color: #fff; }
.btn-success:hover { background: #16a34a; }
.btn-outline { background: #fff; color: var(--accent1); border: 2px solid var(--accent1); }
.btn-outline:hover { background: #eff6ff; }
.btn-sm { padding: 8px 20px; font-size: .85rem; }
.btn-ghost { background: transparent; color: var(--text2); padding: 8px 12px; }
.btn-ghost:hover { color: var(--text); background: var(--bg); }

/* 结果页 */
.result-card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 32px; margin-bottom: 24px; text-align: center;
}
.result-card .score-ring {
  width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; font-weight: 800; color: #fff;
}
.result-card .stars { font-size: 1.8rem; margin-bottom: 8px; }
.result-card .stats-row {
  display: flex; justify-content: center; gap: 40px; margin: 20px 0;
}
.result-card .stat-item { text-align: center; }
.result-card .stat-num { font-size: 1.4rem; font-weight: 700; }
.result-card .stat-label { font-size: .75rem; color: var(--text2); }

.wrong-list { margin-top: 16px; }
.wrong-item {
  background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px;
  padding: 14px 18px; margin-bottom: 10px; page-break-inside: avoid;
}
.wrong-item .wi-q { font-size: .95rem; margin-bottom: 6px; }
.wrong-item .wi-a { font-size: .82rem; color: var(--text2); }
.wrong-item .wi-a b { color: var(--accent2); }
.wrong-item .wi-a .red { color: var(--danger); font-weight: 600; }

/* ---------- 错题本 ---------- */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text2);
}
.empty-state .icon { font-size: 3.5rem; margin-bottom: 12px; opacity: .5; }

/* ---------- 设置 ---------- */
.settings-label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 4px; }
.settings-row { margin-bottom: 16px; }
select, input[type="number"] {
  padding: 8px 12px; border: 2px solid var(--border); border-radius: 8px;
  font-size: .95rem; width: 100%; max-width: 200px;
}
.toggle-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.toggle {
  position: relative; width: 48px; height: 26px; flex-shrink: 0;
}
.toggle input { display: none; }
.toggle .track {
  display: block; width: 100%; height: 100%; border-radius: 13px;
  background: #cbd5e1; transition: background .2s; cursor: pointer;
}
.toggle .knob {
  position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2);
  transition: left .2s;
}
.toggle input:checked + .track { background: var(--accent1); }
.toggle input:checked + .track .knob { left: 25px; }

/* ---------- 全局数学排版组件 ---------- */

/* 竖式分数 */
.math-frac {
  display: inline-flex; flex-direction: column; align-items: center;
  vertical-align: -.35em; line-height: 1; margin: 0 .15em;
  font-size: .92em;
}
.math-frac-top { padding-bottom: .12em; }
.math-frac-bot { padding-top: .12em; border-top: .1em solid currentColor; }

/* 指数（专用类，不干扰普通 <sup>） */
sup.math-sup {
  font-size: .72em; line-height: 1; vertical-align: super;
  position: relative; top: -.15em; margin-left: .02em;
}

/* 根号 */
.math-sqrt {
  display: inline-flex; align-items: stretch; vertical-align: -.1em;
  white-space: nowrap;
}
.math-sqrt-sym {
  font-size: 1.25em; line-height: 1; padding-right: 1px;
  align-self: stretch; display: flex; align-items: flex-start;
}
.math-sqrt-bar {
  border-top: .1em solid currentColor; padding-top: .05em;
  display: flex; align-items: flex-end;
}
.math-sqrt-inner { padding: 0 .25em 0 .1em; }

/* k × √m 里的乘号 */
.math-dot { margin: 0 .12em; font-size: .9em; }

/* 负号/减号 */
.math-neg { margin: 0 .05em; }

/* 括号 */
.math-paren { font-size: 1.05em; margin: 0 .02em; }

/* 余数显示（保留） */
.rem { font-size: .8em; color: var(--text2); margin: 0 2px; }

/* 旧类名兼容（generators 生成的 .fr .sqrt 由 JS 内联使用） */
.fr {
  display: inline-flex; flex-direction: column; align-items: center;
  vertical-align: -.35em; line-height: 1; margin: 0 2px; font-size: .92em;
}
.fr-n { padding-bottom: .12em; }
.fr-d { padding-top: .12em; border-top: .1em solid currentColor; }
.sqrt {
  display: inline-flex; align-items: stretch; vertical-align: -.1em; white-space: nowrap;
}
.sqrt-sym { font-size: 1.25em; line-height: 1; padding-right: 1px; }
.sqrt-body { border-top: .1em solid currentColor; padding: 0 4px 0 2px; }

/* ---------- 底部：回到主页按钮 + 版权 ---------- */
.bt-home {
  display: block; width: fit-content;
  margin: 28px auto 8px; padding: 11px 26px;
  background: linear-gradient(135deg, #35d29a, #2f9df0);
  color: #fff; border: none; border-radius: 999px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  text-decoration: none;
  box-shadow: 0 4px 14px rgba(47, 157, 240, .22);
  transition: transform .15s, box-shadow .25s;
}
.bt-home:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(47, 157, 240, .32); }
.bt-home:active { transform: scale(.97); }

.site-footer {
  text-align: center; padding: 18px 0 24px;
  color: var(--text2); font-size: .78rem;
  border-top: 1px solid var(--border); margin-top: 12px;
}

/* ---------- 打印样式 ---------- */
@media print {
  body { background: #fff; color: #000; }
  .container { max-width: none; padding: 0; margin: 0; }
  .header, .q-tag, .next-area, .btn, .quiz-topbar, .progress-bar, .answer-area { display: none !important; }
  .q-page {
    box-shadow: none; border: none; border-radius: 0;
    padding: 12px 0; margin-bottom: 16px; min-height: auto;
    page-break-inside: avoid;
  }
  .q-page .q-stem { font-size: 1.2rem; }
  .explain-box { display: block !important; background: none; border: 1px solid #ddd; }
  .wrong-item { background: none; border: 1px solid #ddd; }
  .result-card { box-shadow: none; page-break-inside: avoid; }
  @page { size: A4; margin: 15mm; }
}

/* ---------- 移动端 ---------- */
@media (max-width: 840px) {
  .container { max-width: 100%; padding: 12px; }
  .q-page { padding: 18px 16px; min-height: auto; }
  .q-page .q-stem { font-size: 1.2rem; }
  .stage-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .result-card .stats-row { flex-wrap: wrap; gap: 20px; }
}

/* 教练微信号提示框 */
.coach-tip{position:relative;display:inline-block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.coach-tip .tip{visibility:hidden;opacity:0;position:absolute;bottom:145%;left:50%;transform:translateX(-50%) translateY(4px);background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;padding:7px 14px;border-radius:10px;font-size:12.5px;font-weight:700;white-space:nowrap;letter-spacing:.5px;z-index:99;pointer-events:none;box-shadow:0 6px 18px rgba(47,157,240,.35);transition:opacity .2s ease,transform .2s ease,visibility .2s}
.coach-tip .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#2f9df0}
.coach-tip:hover .tip,.coach-tip:active .tip,.coach-tip:focus .tip{visibility:visible;opacity:1;transform:translateX(-50%) translateY(0)}
.coach-footer{text-align:center;padding:14px 0 18px;color:var(--text2,#7f8c8d);font-size:.75rem}


/* ========== 手机号验证锁屏 ========== */
.lock-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(15,23,42,.78); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
.lock-overlay.hidden { display: none; }
.lock-card {
  background: #fff; border-radius: 20px; padding: 32px 28px 24px;
  width: 340px; max-width: 92vw; text-align: center;
  box-shadow: 0 24px 60px rgba(0,0,0,.25); animation: lockIn .35s ease;
}
@keyframes lockIn { from { opacity:0; transform: translateY(20px) scale(.96); } to { opacity:1; transform: translateY(0) scale(1); } }
.lock-card .lock-icon { font-size: 48px; margin-bottom: 6px; }
.lock-card h2 { font-size: 18px; font-weight: 800; color: #1e293b; margin-bottom: 6px; }
.lock-card .lock-desc { font-size: 12px; color: #94a3b8; margin-bottom: 18px; line-height: 1.6; }
.lock-input-row { display: flex; gap: 8px; }
.lock-input-row input {
  flex: 1; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 12px;
  font-size: 16px; outline: none; text-align: center; letter-spacing: 2px;
  font-family: inherit; transition: border-color .2s;
}
.lock-input-row input:focus { border-color: #3b82f6; }
.lock-input-row input.error { border-color: #ef4444; background: #fef2f2; animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.lock-input-row button {
  padding: 12px 22px; background: linear-gradient(135deg,#35d29a,#2f9df0);
  color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
  cursor: pointer; white-space: nowrap; transition: transform .15s;
}
.lock-input-row button:hover { transform: scale(1.03); }
.lock-input-row button:active { transform: scale(.97); }
.lock-input-row button:disabled { opacity: .5; cursor: not-allowed; }
.lock-loading { display: none; margin-top: 10px; font-size: 12px; color: #64748b; }
.lock-loading.show { display: block; }
.lock-error { display: none; margin-top: 10px; padding: 8px 12px; background: #fef2f2;
  color: #dc2626; border-radius: 8px; font-size: 12px; font-weight: 600; }
.lock-error.show { display: block; }
  .lock-hint { margin-top: 12px; font-size: 11px; color: #94a3b8; line-height: 1.6; }
</style>
</head>
<body>
<!-- 手机号验证锁屏 -->
<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <div class="lock-icon">🔐</div>
    <h2>请输入手机号验证</h2>
    <div class="lock-desc">首次访问需验证手机号<br>验证通过后可 7 天内免登录</div>
    <div class="lock-input-row">
      <input type="tel" id="phoneInput" placeholder="输入 11 位手机号" maxlength="11" inputmode="numeric" autofocus>
      <button id="verifyBtn" onclick="verifyPhone()">验证</button>
    </div>
    <div class="lock-loading" id="lockLoading">⏳ 正在验证…</div>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-hint">仅限已登记手机号访问<br>如有疑问请联系两英豆豆教练</div>
  </div>
</div>

<div class="container" id="app"></div>
<a class="bt-home" href="../index.html">🏠 回到首页</a>
<footer class="site-footer">© <span class="coach-tip" tabindex="0">两英豆豆教练<span class="tip">微信号 ddtt0754</span></span></footer>

<script src="assets/math.js"></script>
<script src="assets/generators.js"></script>
<script src="assets/generators2.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  var overlay = document.getElementById('lockOverlay');
  var phoneInput = document.getElementById('phoneInput');
  var errEl = document.getElementById('lockError');
  var loadEl = document.getElementById('lockLoading');
  var btnEl = document.getElementById('verifyBtn');

  // 有效期 7 天
  var VALID_MS = 7 * 24 * 60 * 60 * 1000;
  var relockTimer = null;

  // Enter 键提交（始终绑定，保证重新锁屏后也能用）
  if (phoneInput) {
    phoneInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter') verifyPhone();
    });
  }
  window.verifyPhone = verifyPhone;

  // Check existing session (1 minute)
  var session = null;
  try { session = JSON.parse(localStorage.getItem('phone_session')); } catch(e) {}
  if (session && session.expires && Date.now() < session.expires) {
    if (overlay) overlay.classList.add('hidden');
    scheduleRelock(session.expires);
    return;
  }

  // Show overlay
  if (overlay) overlay.classList.remove('hidden');
  if (phoneInput) phoneInput.focus();

  // SHA-256 hash phone, fetch hash list, compare
  function sha256(str){
    var encoder = new TextEncoder();
    return crypto.subtle.digest('SHA-256', encoder.encode(str))
      .then(function(buf){
        return Array.from(new Uint8Array(buf))
          .map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      });
  }

  function verifyPhone(){
    var phone = phoneInput.value.replace(/\s+/g, '');
    if (!phone) { showErr('请输入手机号'); shake(); return; }
    if (!/^1\d{10}$/.test(phone)) { showErr('请输入正确的 11 位手机号'); shake(); return; }

    btnEl.disabled = true;
    loadEl.classList.add('show');
    errEl.classList.remove('show');
    phoneInput.classList.remove('error');

    // 兜底哈希列表：fetch 失败（如本地 file:// 打开）时使用，仅存哈希不存明文
    var FALLBACK_HASHES = [
      '413b7b3d5700ad8a6b296c9d0e7107dbd7280a985c1c695db8646c278e510224',
      '679d49b6e57d426b2af961461512559700b9e4c01aa723f0b71682c5f07b31c3',
      'df225757a3ffcac2bd9643323af99631a53300b439da8ff4a8a41f889ce39704',
      'f33f356f0975feb01468d154687a812a113ffa87ac5091ecc99637a552f033e9',
    ];

    function check(phoneHash, hashes){
      var matched = hashes.some(function(h){ return h === phoneHash; });
      loadEl.classList.remove('show');
      btnEl.disabled = false;
      if (matched) {
        unlock(phone);
      } else {
        showErr('输入有误，请重新输入');
        shake();
      }
    }

    // Hash the input, fetch hash list; fallback to embedded list if fetch fails
    sha256(phone).then(function(phoneHash){
      fetch('../jiesuo.html').then(function(r){ return r.text(); }).then(function(text){
        var hashes = text.trim().split(/[\n\r]+/).filter(function(h){ return h.trim(); });
        check(phoneHash, hashes);
      }).catch(function(){
        check(phoneHash, FALLBACK_HASHES);
      });
    }).catch(function(){
      loadEl.classList.remove('show');
      btnEl.disabled = false;
      showErr('设备不支持，请更换浏览器');
    });
  };

  function unlock(phone){
    var now = Date.now();
    var expires = now + VALID_MS;
    localStorage.setItem('phone_session', JSON.stringify({
      phone: phone,
      loginAt: now,
      expires: expires
    }));
    if (overlay) {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity .4s';
      setTimeout(function(){ overlay.classList.add('hidden'); overlay.style.opacity = '1'; }, 400);
    }
    scheduleRelock(expires);
  }

  // 有效期结束后重新锁屏（页面停留期间也会触发）
  function relock(){
    relockTimer = null;
    try { localStorage.removeItem('phone_session'); } catch(e) {}
    if (!overlay) return;
    phoneInput.value = '';
    errEl.classList.remove('show');
    overlay.classList.remove('hidden');
    overlay.style.opacity = '1';
    overlay.style.transition = 'none';
    if (phoneInput) phoneInput.focus();
  }

  function scheduleRelock(expires){
    if (relockTimer) { clearTimeout(relockTimer); relockTimer = null; }
    var remain = expires - Date.now();
    if (remain <= 0) { relock(); return; }
    relockTimer = setTimeout(relock, remain);
  }

  function showErr(msg){
    errEl.textContent = msg;
    errEl.classList.add('show');
    setTimeout(function(){ errEl.classList.remove('show'); }, 3000);
  }

  function shake(){
    phoneInput.classList.add('error');
    setTimeout(function(){ phoneInput.classList.remove('error'); }, 400);
  }
})();
</script>
