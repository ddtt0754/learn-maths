<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2ebd85">
<title>作业中心 · 在线作业布置与批改</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#eefaf4 0%,#eef4fb 100%);color:#33434b;
    padding:20px 14px 50px;min-height:100vh;display:flex;justify-content:center;font-size:15px}
  .wrap{width:100%;max-width:960px}
  /* 头部（参照 simulation/knowledge 样式） */
  .hdr{position:relative;background:linear-gradient(135deg,#35d29a,#2f9df0);
    border-radius:22px;padding:30px 18px 26px;text-align:center;color:#fff;
    overflow:hidden;box-shadow:0 14px 30px rgba(47,157,240,.25);margin-bottom:16px}
  .hdr::before,.hdr::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
  .hdr::before{width:120px;height:120px;top:-40px;right:-30px}
  .hdr::after{width:70px;height:70px;bottom:-24px;left:-16px}
  .hdr h1{position:relative;font-size:24px;letter-spacing:2px;font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,.12)}
  .hdr .sub{position:relative;margin-top:10px;font-size:13px;letter-spacing:3px;opacity:.95}
  .tips{background:#fff;border-radius:12px;padding:11px 14px;font-size:13px;color:#5b6b7c;
    line-height:1.8;margin-bottom:14px;box-shadow:0 4px 12px rgba(47,157,240,.08)}
  .tips b{color:#0f9d58}
  /* 作业中心容器 */
  .hw-box{width:100%;background:#fff;border-radius:16px;overflow:hidden;
    box-shadow:0 8px 22px rgba(47,157,240,.12);border:1px solid #e2ecf5}
  .hw-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 16px;background:linear-gradient(120deg,#35d29a,#2f9df0);color:#fff;font-size:14px;font-weight:700}
  .hw-bar .ico{font-size:16px}
  .hw-bar a{color:#fff;font-size:12px;font-weight:600;text-decoration:none;
    background:rgba(255,255,255,.22);padding:6px 14px;border-radius:999px;white-space:nowrap}
  .hw-frame{position:relative;width:100%;height:76vh;min-height:500px;background:#f8fafc}
  .hw-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:block}
  .hw-tip{text-align:center;font-size:12px;color:#8aa09a;margin-top:10px;line-height:1.8}
  /* 底部按钮 */
  .home-row{display:flex;justify-content:center;margin-top:20px}
  .home-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#1fa873;
    border:1.5px solid #2ebd85;padding:12px 28px;border-radius:999px;font-size:14px;font-weight:800;
    text-decoration:none;box-shadow:0 4px 12px rgba(46,158,107,.14);
    transition:transform .15s;touch-action:manipulation}
  .home-btn:active{transform:scale(.95)}
  footer{width:100%;margin-top:18px;text-align:center;font-size:12px;color:#a8bcb4;letter-spacing:1px}
  .coach-tip{position:relative;display:inline-block;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .coach-tip .tip{visibility:hidden;opacity:0;position:absolute;bottom:145%;left:50%;transform:translateX(-50%) translateY(4px);
    background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;padding:7px 14px;border-radius:10px;font-size:12.5px;
    font-weight:700;white-space:nowrap;letter-spacing:.5px;z-index:99;pointer-events:none;box-shadow:0 6px 18px rgba(47,157,240,.35);
    transition:opacity .2s ease,transform .2s ease,visibility .2s}
  .coach-tip .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:#2f9df0}
  .coach-tip:hover .tip,.coach-tip:active .tip,.coach-tip:focus .tip{visibility:visible;opacity:1;transform:translateX(-50%) translateY(0)}

/* ========== 手机号验证锁屏 ========== */
.lock-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(15,23,42,.78); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
.lock-overlay.hidden { display: none; }
.lock-card {
  background: #fff; border-radius: 20px; padding: 32px 28px 24px;
  width: 340px; max-width: 92vw; text-align: center;
  box-shadow: 0 24px 60px rgba(0,0,0,.25); animation: lockIn .35s ease;
}
@keyframes lockIn { from { opacity:0; transform: translateY(20px) scale(.96); } to { opacity:1; transform: translateY(0) scale(1); } }
.lock-card .lock-icon { font-size: 48px; margin-bottom: 6px; }
.lock-card h2 { font-size: 18px; font-weight: 800; color: #1e293b; margin-bottom: 6px; }
.lock-card .lock-desc { font-size: 12px; color: #94a3b8; margin-bottom: 18px; line-height: 1.6; }
.lock-input-row { display: flex; gap: 8px; }
.lock-input-row input {
  flex: 1; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 12px;
  font-size: 16px; outline: none; text-align: center; letter-spacing: 2px;
  font-family: inherit; transition: border-color .2s;
}
.lock-input-row input:focus { border-color: #3b82f6; }
.lock-input-row input.error { border-color: #ef4444; background: #fef2f2; animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.lock-input-row button {
  padding: 12px 22px; background: linear-gradient(135deg,#35d29a,#2f9df0);
  color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
  cursor: pointer; white-space: nowrap; transition: transform .15s;
}
.lock-input-row button:hover { transform: scale(1.03); }
.lock-input-row button:active { transform: scale(.97); }
.lock-input-row button:disabled { opacity: .5; cursor: not-allowed; }
.lock-loading { display: none; margin-top: 10px; font-size: 12px; color: #64748b; }
.lock-loading.show { display: block; }
.lock-error { display: none; margin-top: 10px; padding: 8px 12px; background: #fef2f2;
  color: #dc2626; border-radius: 8px; font-size: 12px; font-weight: 600; }
.lock-error.show { display: block; }
  .lock-hint { margin-top: 12px; font-size: 11px; color: #94a3b8; line-height: 1.6; }
</style>
</head>
<body>
<!-- 手机号验证锁屏 -->
<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <div class="lock-icon">🔐</div>
    <h2>请输入手机号验证</h2>
    <div class="lock-desc">首次访问需验证手机号<br>验证通过后可 7 天内免登录</div>
    <div class="lock-input-row">
      <input type="tel" id="phoneInput" placeholder="输入 11 位手机号" maxlength="11" inputmode="numeric" autofocus>
      <button id="verifyBtn" onclick="verifyPhone()">验证</button>
    </div>
    <div class="lock-loading" id="lockLoading">⏳ 正在验证…</div>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-hint">仅限已登记手机号访问<br>如有疑问请联系两英豆豆教练</div>
  </div>
</div>

<div class="wrap">
  <header class="hdr">
    <h1>📝 作业中心</h1>
    <p class="sub">在线作业布置 · 批改 · 学情分析</p>
  </header>

  <div class="tips"><b>📌 使用提示：</b>① 支持在线布置/批改作业、查看学情分析；<br>② 首次使用请先<b>登录菁优网账号</b>（右上角登录），登录后自动进入作业中心；<br>③ 建议使用电脑或平板体验最佳。</div>

  <div class="hw-box">
    <div class="hw-bar">
      <span><span class="ico">📝</span> 菁优网作业中心 · jyeoo.com</span>
      <a href="https://www.jyeoo.com/math/homework" target="_blank" rel="noopener">新窗口打开 ↗</a>
    </div>
    <div class="hw-frame">
      <iframe id="hwFrame" src="https://www.jyeoo.com/math/homework"
        title="菁优网作业中心" loading="lazy" allowfullscreen></iframe>
    </div>
  </div>
  <p class="hw-tip">若页面未加载，请点击右上角「新窗口打开 ↗」直接访问</p>

  <div class="home-row"><a class="home-btn" href="../index.html">🏠 返回首页</a></div>
  <footer>© 2026 <span class="coach-tip" tabindex="0">两英豆豆教练<span class="tip">微信号 ddtt0754</span></span></footer>
</div>
<script>
(function(){
  var overlay = document.getElementById('lockOverlay');
  var phoneInput = document.getElementById('phoneInput');
  var errEl = document.getElementById('lockError');
  var loadEl = document.getElementById('lockLoading');
  var btnEl = document.getElementById('verifyBtn');

  // 有效期 7 天
  var VALID_MS = 7 * 24 * 60 * 60 * 1000;
  var relockTimer = null;

  // Enter 键提交（始终绑定，保证重新锁屏后也能用）
  if (phoneInput) {
    phoneInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter') verifyPhone();
    });
  }
  window.verifyPhone = verifyPhone;

  // Check existing session (1 minute)
  var session = null;
  try { session = JSON.parse(localStorage.getItem('phone_session')); } catch(e) {}
  if (session && session.expires && Date.now() < session.expires) {
    if (overlay) overlay.classList.add('hidden');
    scheduleRelock(session.expires);
    return;
  }

  // Show overlay
  if (overlay) overlay.classList.remove('hidden');
  if (phoneInput) phoneInput.focus();

  // SHA-256 hash phone, fetch hash list, compare
  function sha256(str){
    var encoder = new TextEncoder();
    return crypto.subtle.digest('SHA-256', encoder.encode(str))
      .then(function(buf){
        return Array.from(new Uint8Array(buf))
          .map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      });
  }

  function verifyPhone(){
    var phone = phoneInput.value.replace(/\s+/g, '');
    if (!phone) { showErr('请输入手机号'); shake(); return; }
    if (!/^1\d{10}$/.test(phone)) { showErr('请输入正确的 11 位手机号'); shake(); return; }

    btnEl.disabled = true;
    loadEl.classList.add('show');
    errEl.classList.remove('show');
    phoneInput.classList.remove('error');

    // 兜底哈希列表：fetch 失败（如本地 file:// 打开）时使用，仅存哈希不存明文
    var FALLBACK_HASHES = [
      '413b7b3d5700ad8a6b296c9d0e7107dbd7280a985c1c695db8646c278e510224',
      '679d49b6e57d426b2af961461512559700b9e4c01aa723f0b71682c5f07b31c3',
      'df225757a3ffcac2bd9643323af99631a53300b439da8ff4a8a41f889ce39704',
      'f33f356f0975feb01468d154687a812a113ffa87ac5091ecc99637a552f033e9',
    ];

    function check(phoneHash, hashes){
      var matched = hashes.some(function(h){ return h === phoneHash; });
      loadEl.classList.remove('show');
      btnEl.disabled = false;
      if (matched) {
        unlock(phone);
      } else {
        showErr('输入有误，请重新输入');
        shake();
      }
    }

    // Hash the input, fetch hash list; fallback to embedded list if fetch fails
    sha256(phone).then(function(phoneHash){
      fetch('../jiesuo.html').then(function(r){ return r.text(); }).then(function(text){
        var hashes = text.trim().split(/[\n\r]+/).filter(function(h){ return h.trim(); });
        check(phoneHash, hashes);
      }).catch(function(){
        check(phoneHash, FALLBACK_HASHES);
      });
    }).catch(function(){
      loadEl.classList.remove('show');
      btnEl.disabled = false;
      showErr('设备不支持，请更换浏览器');
    });
  };

  function unlock(phone){
    var now = Date.now();
    var expires = now + VALID_MS;
    localStorage.setItem('phone_session', JSON.stringify({
      phone: phone,
      loginAt: now,
      expires: expires
    }));
    if (overlay) {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity .4s';
      setTimeout(function(){ overlay.classList.add('hidden'); overlay.style.opacity = '1'; }, 400);
    }
    scheduleRelock(expires);
  }

  // 有效期结束后重新锁屏（页面停留期间也会触发）
  function relock(){
    relockTimer = null;
    try { localStorage.removeItem('phone_session'); } catch(e) {}
    if (!overlay) return;
    phoneInput.value = '';
    errEl.classList.remove('show');
    overlay.classList.remove('hidden');
    overlay.style.opacity = '1';
    overlay.style.transition = 'none';
    if (phoneInput) phoneInput.focus();
  }

  function scheduleRelock(expires){
    if (relockTimer) { clearTimeout(relockTimer); relockTimer = null; }
    var remain = expires - Date.now();
    if (remain <= 0) { relock(); return; }
    relockTimer = setTimeout(relock, remain);
  }

  function showErr(msg){
    errEl.textContent = msg;
    errEl.classList.add('show');
    setTimeout(function(){ errEl.classList.remove('show'); }, 3000);
  }

  function shake(){
    phoneInput.classList.add('error');
    setTimeout(function(){ phoneInput.classList.remove('error'); }, 400);
  }
})();
</script>

</body>
</html>
