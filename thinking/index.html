<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=3.0">
<title>十大数学思想方法 · 解读与训练</title>
<style>
:root{
  --g:#2ebd85; --b:#2f9df0; --t:#33434b; --l:#8aa09a;
  --bg:#f5fbf8; --card:#ffffff; --text:#33434b; --text2:#6c7a73;
  --border:#e1eeea; --accent1:#2f9df0; --accent2:#2ebd85;
  --danger:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#eefaf4 0%,#eef4fb 100%);
  color:var(--text); font-size:15px;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding-bottom:80px;
}
.wrap{width:100%;max-width:760px; padding:14px 14px 0; flex:1; display:flex; flex-direction:column}

/* ============ 顶部 ============ */
.hdr{
  position:relative;
  background:linear-gradient(135deg,#35d29a,#2f9df0);
  border-radius:20px; padding:24px 18px 22px;
  text-align:center; color:#fff; overflow:hidden;
  box-shadow:0 14px 30px rgba(47,157,240,.25); margin-bottom:12px;
}
.hdr::before,.hdr::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hdr::before{width:120px;height:120px;top:-40px;right:-30px}
.hdr::after{width:70px;height:70px;bottom:-24px;left:-16px}
.hdr h1{position:relative;font-size:21px;letter-spacing:1.5px;font-weight:700}
.hdr .sub{position:relative;margin-top:8px;font-size:13px;opacity:.95}

/* ============ 主页：10 大思想卡片网格 ============ */
.thoughts-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
  margin-bottom:14px;
}
.thought-card{
  background:var(--card); border-radius:16px;
  padding:18px 14px 14px; text-align:center;
  box-shadow:0 4px 14px rgba(47,157,240,.08);
  cursor:pointer; transition:transform .15s, box-shadow .25s;
  border:1.5px solid transparent; position:relative;
}
.thought-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(47,157,240,.16);border-color:#a7f3d0}
.thought-card:active{transform:scale(.97)}
.thought-card.done::before{
  content:"✓"; position:absolute; top:8px; right:10px;
  width:22px; height:22px; border-radius:50%;
  background:var(--accent2); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700;
}
.tc-icon{font-size:32px;margin-bottom:6px}
.tc-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px}
.tc-methods{font-size:11.5px;color:var(--b);font-weight:600;margin-bottom:4px}
.tc-desc{font-size:11.5px;color:var(--text2);line-height:1.4;margin-bottom:6px;min-height:32px}
.tc-meta{font-size:11px;color:var(--l)}
.tc-meta b{color:var(--accent2)}

/* ============ 方法子 tab ============ */
.tabbar{
  display:flex; flex-wrap:nowrap; overflow-x:auto;
  background:var(--card); border-radius:14px; padding:6px;
  margin-bottom:12px; box-shadow:0 4px 12px rgba(47,157,240,.06);
  gap:4px;
}
.tabbar::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; padding:9px 14px; border-radius:10px; cursor:pointer;
  font-size:13px; font-weight:600; color:var(--text2);
  white-space:nowrap; transition:all .2s;
}
.tab:hover{background:#eefaf4;color:var(--g)}
.tab.active{background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff}

/* ============ 解读卡 ============ */
.read-card{
  background:var(--card); border-radius:16px; padding:18px;
  box-shadow:0 4px 14px rgba(47,157,240,.08); margin-bottom:12px;
  border-left:4px solid var(--b);
}
.read-title{font-size:17px;font-weight:700;color:var(--b);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.read-title .num{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;font-size:13px;font-weight:700;
}
.read-sub{font-size:13px;color:var(--l);margin-bottom:8px;font-weight:600}
.read-body{font-size:14px;line-height:1.8;color:var(--text);margin-bottom:10px}
.read-tip{
  background:#fff8e1;border-left:3px solid #f59e0b;
  padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.7;
  color:#7a5a00;
}

/* ============ 题目卡 ============ */
.q-card{
  background:var(--card); border-radius:16px; padding:18px;
  box-shadow:0 4px 14px rgba(47,157,240,.08); margin-bottom:12px;
  flex:1; min-height:300px; display:flex; flex-direction:column;
}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.q-tag{font-size:12px;font-weight:600;color:var(--l);background:#f1f7f4;padding:4px 10px;border-radius:10px}
.q-num{font-size:13px;color:var(--text2);font-weight:600}
.q-num b{color:var(--b);font-size:15px}
.q-stem{
  font-size:15.5px; line-height:1.85; color:var(--text);
  background:#f5fbf8;border-left:3px solid var(--accent2);
  padding:14px 16px;border-radius:8px;margin-bottom:14px;
  white-space:pre-wrap; word-break:break-word;
}

/* 输入区 */
.answer-area{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
.answer-input{
  flex:1; padding:12px 14px; border:2px solid var(--border);
  border-radius:10px; font-size:16px; font-family:inherit;
  transition:border-color .2s; background:#fff;color:var(--text);
}
.answer-input:focus{outline:none;border-color:var(--accent1)}
.answer-input:disabled{background:#f3f7f5;color:var(--text2)}
.btn-submit{
  padding:0 22px; background:linear-gradient(135deg,#35d29a,#2f9df0);
  color:#fff; border:none; border-radius:10px;
  font-size:14px; font-weight:600; cursor:pointer;
  transition:transform .15s;
}
.btn-submit:hover{transform:translateY(-1px)}
.btn-submit:active{transform:scale(.97)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}

/* 反馈 */
.feedback{
  padding:12px 14px; border-radius:10px;
  font-size:14px; line-height:1.7; margin-bottom:12px;
  display:none;
}
.feedback.show{display:block}
.feedback.correct{
  background:#f0fdf4;border-left:4px solid var(--accent2);color:#15803d;
}
.feedback.wrong{
  background:#fef2f2;border-left:4px solid var(--danger);color:#991b1b;
}
.feedback .ans-line{margin-top:6px;font-weight:600}
.feedback .ans-line .ok{color:var(--accent2)}
.feedback .ans-line .no{color:var(--danger);text-decoration:line-through;margin-right:6px}

/* 圆点导航 */
.dots{
  display:flex; gap:6px; flex-wrap:wrap; justify-content:center;
  margin-top:auto; padding-top:12px; border-top:1px solid var(--border);
}
.dot{
  width:30px; height:30px; border-radius:50%;
  background:#f1f7f4; color:var(--text2);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:600; cursor:pointer;
  transition:all .15s;
}
.dot:hover{background:#d8ebe3}
.dot.current{background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;transform:scale(1.1)}
.dot.done{background:var(--accent2);color:#fff}
.dot.wrong{background:var(--danger);color:#fff}

/* ============ 底部固定工具栏 ============ */
.toolbar{
  position:fixed; bottom:0; left:0; right:0;
  background:rgba(255,255,255,.96); backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding:10px 14px; display:flex; gap:8px;
  justify-content:center; flex-wrap:wrap;
  z-index:50; box-shadow:0 -4px 18px rgba(0,0,0,.06);
}
.tool-btn{
  display:inline-flex; align-items:center; gap:5px;
  padding:8px 14px; background:#fff; border:1.5px solid var(--border);
  border-radius:999px; font-size:13px; color:var(--text);
  cursor:pointer; transition:all .2s; font-weight:600;
}
.tool-btn:hover{border-color:var(--b);color:var(--b)}
.tool-btn.primary{
  background:linear-gradient(135deg,#35d29a,#2f9df0);
  color:#fff;border-color:transparent;
}
.tool-btn.primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(47,157,240,.28)}
.tool-btn.timer-active{background:#fef3c7;border-color:#f59e0b;color:#b45309}

/* ============ 底部 ============ */
.bt-home{
  display:block; width:fit-content;
  margin:18px auto 8px; padding:11px 26px;
  background:linear-gradient(135deg,#35d29a,#2f9df0);
  color:#fff; border:none; border-radius:999px;
  font-size:14px; font-weight:600; cursor:pointer;
  text-decoration:none;
  box-shadow:0 4px 14px rgba(47,157,240,.22);
  transition:transform .15s, box-shadow .25s;
}
.bt-home:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(47,157,240,.32)}
.bt-home:active{transform:scale(.97)}
.site-footer{
  text-align:center; padding:14px 0 22px;
  color:var(--text2); font-size:.78rem;
  border-top:1px solid var(--border); margin-top:6px; width:100%;
}

/* ============ 弹窗 ============ */
.modal{
  position:fixed; inset:0; background:rgba(0,0,0,.45);
  display:none; align-items:center; justify-content:center;
  z-index:100; padding:14px;
}
.modal.show{display:flex}
.modal-card{
  background:#fff; border-radius:16px; padding:22px 22px 18px;
  max-width:480px; width:100%; max-height:80vh; overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}
.modal-card h3{
  font-size:18px;font-weight:700;color:var(--b);margin-bottom:14px;
  display:flex; align-items:center; gap:8px;
}
.modal-close{
  float:right; background:none; border:none; font-size:22px;
  cursor:pointer; color:var(--text2); line-height:1;
}

/* 报告 */
.report-summary{
  display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;
}
.stat{
  background:#f5fbf8; border-radius:10px; padding:12px; text-align:center;
}
.stat .v{font-size:24px;font-weight:700;color:var(--b)}
.stat .l{font-size:12px;color:var(--text2);margin-top:2px}
.report-list{font-size:13px;line-height:1.8}
.report-list .item{padding:8px 10px;border-radius:8px;margin-bottom:6px;background:#f5fbf8}
.report-list .item.no{border-left:3px solid var(--danger)}

/* 功能一览 */
.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feat{
  background:#f5fbf8; border-radius:10px; padding:12px; font-size:12.5px;
  line-height:1.6; color:var(--text);
}
.feat .icon{font-size:22px;margin-bottom:6px}
.feat b{color:var(--b);display:block;margin-bottom:3px;font-size:13px}

/* 返回主页按钮（主页模式用） */
.back-btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:9px 18px; background:#fff; border:1.5px solid var(--border);
  border-radius:999px; font-size:13px; font-weight:600;
  color:var(--text); cursor:pointer; margin-bottom:12px;
  transition:all .2s;
}
.back-btn:hover{border-color:var(--b);color:var(--b)}

/* 响应式 */
@media(max-width:380px){
  .hdr h1{font-size:18px}
  .thought-card{padding:14px 8px 10px}
  .tc-icon{font-size:26px}
  .tc-title{font-size:13px}
  .thoughts-grid{grid-template-columns:1fr 1fr;gap:8px}
  .tool-btn{padding:7px 10px;font-size:12px}
  .feat-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <h1>💡 中小学十大数学思想方法</h1>
    <p class="sub">数形结合 · 转化化归 · 分类讨论 · 方程函数 · 归纳猜想 · 逆向递推 · 假设反证 · 概率统计 · 整体 · 模型</p>
  </header>

  <div id="content"></div>
  <a class="bt-home" href="../index.html">🏠 返回首页</a>
  <div class="toolbar" id="toolbar">
    <button class="tool-btn" id="btnTimer">⏱ 计时 0:00</button>
    <button class="tool-btn" id="btnReport">📊 练习报告</button>
    <button class="tool-btn" id="btnFeat">📖 功能一览</button>
    <button class="tool-btn" id="btnRefresh">🔄 同类题目</button>
    <button class="tool-btn primary" id="btnNext">▶ 下一题</button>
  </div>

  <footer class="site-footer">© 两英豆豆教练</footer>
</div>

<!-- 报告弹窗 -->
<div class="modal" id="reportModal">
  <div class="modal-card">
    <button class="modal-close" data-close>×</button>
    <h3>📊 练习报告</h3>
    <div id="reportBody"></div>
  </div>
</div>

<!-- 功能一览弹窗 -->
<div class="modal" id="featModal">
  <div class="modal-card">
    <button class="modal-close" data-close>×</button>
    <h3>📖 功能一览</h3>
    <div class="feat-grid" id="featGrid"></div>
    <p style="margin-top:14px;font-size:12.5px;color:var(--text2);line-height:1.7">
      <b style="color:var(--b)">使用提示：</b><br>
      ① 主页展示 10 大思想方法卡片，点击进入对应训练；<br>
      ② 训练页顶部可切换具体方法子标签（如「分解组合法」「旋转平移法」）；<br>
      ③ 解读卡先看方法思想，再学解题技巧；<br>
      ④ 填空作答后回车提交或点「确认」；<br>
      ⑤ 底部圆点可跳到任意题目，已答绿、答错红；<br>
      ⑥ 「同类题目」按相同思想方法生成新变式题；<br>
      ⑦ 答完后点「练习报告」查看正确率与错题。
    </p>
  </div>
</div>

<script>
/* ============================================================
 * 十大数学思想方法 · 解读与训练（新版分组）
 * 10 大思想 + 每个思想含若干具体方法 + 每类2道练习题
 * 题目来源：十大方法练习题.docx
 * ============================================================ */
(function(){
'use strict';

/* ============ 10 大思想方法数据 ============ */
const THOUGHTS = [
  {
    id:1, name:'转化与化归思想', icon:'🔄', color:'#2f9df0',
    methods:[
      { id:'a', name:'分解组合法', tag:'分解组合' },
      { id:'b', name:'旋转平移法', tag:'旋转平移' }
    ],
    desc:'把陌生、复杂的问题转化为熟悉、简单的问题',
    body:'<b>转化与化归思想</b>是数学解题的"翻译官"。核心思路：把题目从陌生形式翻译成熟悉形式（如异分母→同分母、小数除法→整数除法、复杂图→基本图形）。一旦问题被"翻译"成功，往往可以套用已知公式或方法直接求解。',
    tip:'① 分数小数互化便于比较；② 小数除法同时 ×10 的倍数化为整数除；③ 几何问题代数化（设未知长）；④ 复合问题拆成单一问题再合；⑤ 旋转平移用于求不规则图形面积，把"局部"拼成"整体"再算。'
  },
  {
    id:2, name:'数形结合思想', icon:'📐', color:'#2ebd85',
    methods:[{ id:'a', name:'画图法', tag:'画图' }],
    desc:'用图形、线段、面积把抽象数量关系可视化',
    body:'<b>数形结合思想</b>是把抽象的数量关系用具体的图形表示出来的思想方法。图形让问题变得直观——"看见"的数量关系比"读出来"的更容易理解。小学阶段最常用的解题工具之一。',
    tip:'① 读题先把关键数量标在图上；② 线段图分清"整体"与"部分"；③ 面积模型画矩形分块表示分数乘法（如 0.6×0.4 的矩形重叠部分）；④ 行程问题用横轴时间、纵轴距离；⑤ 比的应用画两条线段对照。'
  },
  {
    id:3, name:'分类讨论思想', icon:'📊', color:'#f59e0b',
    methods:[
      { id:'a', name:'枚举法', tag:'枚举' },
      { id:'b', name:'树形图法', tag:'树形图' }
    ],
    desc:'把问题分成若干情形逐一讨论，不重不漏',
    body:'<b>分类讨论思想</b>用于问题存在多种可能情形时。把所有情形按统一标准列出来分别讨论，关键是分类标准要清晰、不重不漏。计数、组合、位置、不等式等题型必备。',
    tip:'① 找分类标准（位置、对称、大小、奇偶、正负）；② 做到"不重不漏"，用树形图或表格；③ 数字组合问题常用"定高位排低位"；④ 分类计数后乘以对称倍数时小心重叠；⑤ 检验分类是否穷尽。'
  },
  {
    id:4, name:'函数与方程思想', icon:'📈', color:'#a855f7',
    methods:[
      { id:'a', name:'符号法', tag:'符号' },
      { id:'b', name:'方程法', tag:'方程' }
    ],
    desc:'用字母符号、方程、不等式刻画数量关系',
    body:'<b>函数与方程思想</b>是代数核心。把"未知"设为字母，用等式或不等式表达数量关系，再通过解方程求未知量。把"逆向思考"转化为"正向运算"，是从算术思维过渡到代数思维的桥梁。',
    tip:'① 设未知数通常设"所求量"；② 找等量关系（和差倍、先后变化、相遇追及）；③ 复杂问题多用间接设（如设总量不设部分量）；④ 列完带单位验证合理性；⑤ 函数思想看变化规律，方程思想求具体值。'
  },
  {
    id:5, name:'归纳与类比思想', icon:'🔁', color:'#ec4899',
    methods:[
      { id:'a', name:'周期法', tag:'周期' },
      { id:'b', name:'猜想归纳法', tag:'归纳' }
    ],
    desc:'从特殊情形观察规律，归纳出一般结论',
    body:'<b>归纳与类比思想</b>是从有限个特例中发现一般规律的思想。先观察若干简单情形，找出差分或比值的规律，再用规律推测更一般的情形。是发现数学公式的核心武器。',
    tip:'① 写出前 4-5 项找规律；② 看差分（一阶差分恒定→等差，二阶差分恒定→二次型）；③ 三角数列 n(n+1)/2、平方数列 n² 都是经典；④ 周期问题先求最小循环节；⑤ 用 n=1,2,3 代入公式验证。'
  },
  {
    id:6, name:'逆向与递推思想', icon:'⏪', color:'#6366f1',
    methods:[
      { id:'a', name:'倒推法', tag:'倒推' },
      { id:'b', name:'递推法', tag:'递推' }
    ],
    desc:'从结果出发，按逆过程反推原数',
    body:'<b>逆向与递推思想</b>是从已知结果反向推导初始状态的思想方法。原题"经过若干步运算得到结果，求原来"时，倒推法比正向求解简洁得多。递推则是从前项推后项的序列思想。',
    tip:'① 加变减、减变加；② 乘变除、除变乘；③ 百分数增减可还原（增20%即×1.2，倒推×1/1.2）；④ 半桶油问题用"倒推线段图"更直观；⑤ 递推问题先写出前几项找递推关系式。'
  },
  {
    id:7, name:'假设与反证思想', icon:'🔬', color:'#0ea5e9',
    methods:[
      { id:'a', name:'特殊值法', tag:'特殊值' },
      { id:'b', name:'排除法', tag:'排除' }
    ],

let state = {
  view: 'home',         // 'home' | 'practice'
  thoughtIdx: 0,        // 当前大思想索引
  methodIdx: 0,         // 当前大思想内的子方法索引
  qIdx: 0,              // 当前题号（合并所有方法题目）

  timerSec: 0,
  timerOn: false,
  timerStart: null,
  timerTick: null
};

/* ============ 工具 ============ */
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function fmtTime(s){ return Math.floor(s/60) + ':' + pad(s%60); }
function escHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function judge(input, q){
  const s = String(input).trim().toLowerCase();
  if (!s) return false;
  if (s === q.answer.toLowerCase()) return true;
  const accepts = q.accept || [q.answer];
  for (const a of accepts) {
    if (s === a.toLowerCase()) return true;
  }
  const numAns = Number(q.answer);
  if (!isNaN(numAns) && isFinite(numAns)) {
    const numIn = Number(s);
    if (!isNaN(numIn) && Math.abs(numIn - numAns) < 0.01) return true;
    if (s.includes('/')) {
      const parts = s.split('/');
      if (parts.length === 2) {
        const a = Number(parts[0]), b = Number(parts[1]);
        if (!isNaN(a) && !isNaN(b) && b !== 0 && Math.abs(a/b - numAns) < 0.01) return true;
      }
    }
  }
  if (q.answer.includes('不') || q.answer.includes('成立')) {
    for (const a of accepts) {
      const ka = a.toLowerCase();
      if (s === ka) return true;
      if (s.includes(ka) || ka.includes(s)) return true;
    }
  }
  return false;
}

/* ============ 数据辅助 ============ */
function thoughtQuestions(t){
  // 返回某大思想下所有方法的所有题目（按方法顺序）
  const qs = [];
  t.methods.forEach((m, mi) => {
    for (let i = 0; i < 2; i++) {
      const key = t.id + '-' + m.id + '-' + i;
      if (QUESTIONS[key]) qs.push({ key, methodIdx: mi, methodName: m.name });
    }
  });
  return qs;
}

function isThoughtDone(t){
  const qs = thoughtQuestions(t);
  if (qs.length === 0) return false;
  return qs.every(q => state.answered[q.key] && state.answered[q.key].ok);
}

function thoughtProgress(t){
  const qs = thoughtQuestions(t);
  const done = qs.filter(q => state.answered[q.key]).length;
  return done + '/' + qs.length;
}

/* ============ 渲染：主页 ============ */
function renderHome(){
  const cards = THOUGHTS.map((t, i) => {
    const qs = thoughtQuestions(t);
    const done = isThoughtDone(t);
    const prog = thoughtProgress(t);
    const methodsText = t.methods.map(m => m.name).join(' · ');
    return `<div class="thought-card${done ? ' done' : ''}" data-idx="${i}" style="border-left:4px solid ${t.color}">
      <div class="tc-icon" style="color:${t.color}">${t.icon}</div>
      <div class="tc-title">${t.name}</div>
      <div class="tc-methods">${methodsText}</div>
      <div class="tc-desc">${t.desc}</div>
      <div class="tc-meta">题目 <b>${prog}</b> · 共 ${qs.length} 题</div>
    </div>`;
  }).join('');
  document.getElementById('content').innerHTML = `
    <div style="background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 12px rgba(47,157,240,.06);font-size:13px;line-height:1.7;color:#555">
      <b style="color:var(--b)">📌 使用提示：</b>点击下方任一卡片进入该思想的练习页。每个思想含 2 道经典题，已附教师级解析。
    </div>
    <div class="thoughts-grid">${cards}</div>
  `;
  document.querySelectorAll('.thought-card').forEach(el => {
    el.addEventListener('click', () => {
      state.thoughtIdx = parseInt(el.dataset.idx);
      state.methodIdx = 0;
      state.qIdx = 0;
      state.view = 'practice';
      renderAll();
      window.scrollTo(0, 0);
    });
  });
}

        ${ans ? (ans.ok
          ? `<b>✓ 回答正确！</b><div class="ans-line">你的答案：<span class="ok">${escHtml(ans.input)}</span></div>${q.explain ? '<div style="margin-top:8px;font-size:13px;color:var(--text2);line-height:1.7"><b>解析：</b>' + escHtml(q.explain).replace(/\n/g, '<br>') + '</div>' : ''}`
          : `<b>✗ 回答错误</b><div class="ans-line">你的答案：<span class="no">${escHtml(ans.input)}</span>正确答案：<span class="ok">${escHtml(q.answer)}</span></div>${q.explain ? '<div style="margin-top:8px;font-size:13px;color:var(--text2);line-height:1.7"><b>解析：</b>' + escHtml(q.explain).replace(/\n/g, '<br>') + '</div>' : ''}`
        ) : ''}
      </div>
      <div class="dots">${dots}</div>
    </div>
  `;

  // 绑定
  document.getElementById('btnBackHome').addEventListener('click', () => {
    state.view = 'home';
    renderAll();
    window.scrollTo(0, 0);
  });
  document.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => {
      state.methodIdx = parseInt(el.dataset.mi);
      state.qIdx = 0;
      renderPractice();
    });
  });
  const input = document.getElementById('ansInput');
  const submit = document.getElementById('btnSubmit');
  if (input && submit) {
    const fn = () => doSubmit();
    submit.addEventListener('click', fn);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') fn(); });
    if (!ans) setTimeout(() => input.focus(), 50);
  }
  document.querySelectorAll('.dot').forEach(d => {
    d.addEventListener('click', () => {
      state.qIdx = parseInt(d.dataset.qi);
      renderPractice();
    });
  });
}

function doSubmit(){
  const t = THOUGHTS[state.thoughtIdx];
  const qs = thoughtQuestions(t);
  const curQ = qs[state.qIdx];
  const q = QUESTIONS[curQ.key];
  const input = document.getElementById('ansInput');
  if (!input) return;
  const val = input.value.trim();
  if (!val) { input.focus(); return; }
  const ok = judge(val, q);
  state.answered[curQ.key] = { input: val, ok: ok, ts: Date.now() };
  if (!state.timerOn) startTimer();
  renderPractice();
}

/* ============ 渲染：全部 ============ */
function renderAll(){
  if (state.view === 'home') renderHome();
  else renderPractice();
}

/* ============ 计时 ============ */
function startTimer(){
  state.timerOn = true;
  state.timerStart = Date.now() - state.timerSec * 1000;
  updateTimerBtn();
  state.timerTick = setInterval(() => {
    state.timerSec = Math.floor((Date.now() - state.timerStart) / 1000);
    updateTimerBtn();
  }, 1000);
}
function stopTimer(){
  state.timerOn = false;
  if (state.timerTick) clearInterval(state.timerTick);
  state.timerTick = null;
  updateTimerBtn();
}
function toggleTimer(){
  if (state.timerOn) stopTimer();
  else startTimer();
}
function updateTimerBtn(){
  const btn = document.getElementById('btnTimer');
  if (!btn) return;
  btn.textContent = '⏱ ' + fmtTime(state.timerSec);
  btn.classList.toggle('timer-active', state.timerOn);
}

/* ============ 报告 ============ */
function computeStats(){
  let total = 0, done = 0, correct = 0, wrong = 0;
  const wrongList = [];
  THOUGHTS.forEach(t => {
    const qs = thoughtQuestions(t);
    qs.forEach(qi => {
      total++;
      const a = state.answered[qi.key];
      if (a) {
        done++;
        if (a.ok) correct++;
        else {
          wrong++;
          const q = QUESTIONS[qi.key];
          wrongList.push({ name: t.name, stem: q.stem, input: a.input, correct: q.answer });
        }
      }
    });
  });
  return { total, done, correct, wrong, rate: total > 0 ? Math.round((correct/total)*100) : 0, wrongList };
}

function showReport(){
  const stats = computeStats();
  const body = document.getElementById('reportBody');
  body.innerHTML = `
    <div class="report-summary">
      <div class="stat"><div class="v">${stats.total}</div><div class="l">总题数</div></div>
      <div class="stat"><div class="v">${stats.done}</div><div class="l">已作答</div></div>
      <div class="stat"><div class="v" style="color:var(--accent2)">${stats.correct}</div><div class="l">答对</div></div>
      <div class="stat"><div class="v" style="color:var(--danger)">${stats.wrong}</div><div class="l">答错</div></div>
      <div class="stat" style="grid-column:span 2"><div class="v">${stats.rate}%</div><div class="l">正确率 · 用时 ${fmtTime(state.timerSec)}</div></div>
    </div>
    <h4 style="font-size:14px;color:var(--text2);margin-bottom:8px">📋 错题列表</h4>
    <div class="report-list">
      ${stats.wrongList.length === 0 ? '<div style="color:var(--text2);padding:8px">暂无错题，继续保持！</div>' :
        stats.wrongList.map(w => `<div class="item no"><b>${w.name}</b>：${w.stem.slice(0,40)}…<br>你的答案：<span style="color:var(--danger);text-decoration:line-through">${escHtml(w.input)}</span> ｜ 正确答案：<span style="color:var(--accent2)">${escHtml(w.correct)}</span></div>`).join('')}
    </div>
    <div style="margin-top:14px;text-align:center">
      <button class="tool-btn primary" onclick="document.getElementById('reportModal').classList.remove('show')">关闭</button>
    </div>
  `;
  document.getElementById('reportModal').classList.add('show');
}

/* ============ 功能一览 ============ */
function fillFeat(){
  document.getElementById('featGrid').innerHTML = `
    <div class="feat"><div class="icon">🏠</div><b>主页 10 大思想</b>点击卡片进入对应思想训练</div>
    <div class="feat"><div class="icon">📑</div><b>子方法 tab</b>含多种子方法时顶部切换</div>
    <div class="feat"><div class="icon">💡</div><b>解读卡</b>大思想解读 + 具体方法 + 解题技巧</div>
    <div class="feat"><div class="icon">✏️</div><b>填空作答</b>基于原 .docx 文档题目，回车提交即时判定</div>
    <div class="feat"><div class="icon">⭕</div><b>圆点导航</b>底部圆点跳题，已答绿/答错红</div>
    <div class="feat"><div class="icon">🔄</div><b>同类题目</b>按相同思想方法生成新变式题</div>
    <div class="feat"><div class="icon">⏱</div><b>计时功能</b>答第 1 题自动开始计时，可手动启停</div>
    <div class="feat"><div class="icon">📊</div><b>练习报告</b>正确率、用时、错题明细</div>
    <div class="feat"><div class="icon">📖</div><b>功能一览</b>弹窗查看全部功能与使用提示</div>
    <div class="feat"><div class="icon">🏠</div><b>一键回主页</b>底部按钮快速返回数学 H5 主页</div>
  `;
}

/* ============ 同类题目 ============ */
function refreshSameKind(){
  const t = THOUGHTS[state.thoughtIdx];
  alert(`🔄 同类题目（${t.name}）\n\n该功能即将按 ${t.name} 的方法思路重新生成变式题。\n当前页面已收录 .docx 文档中所有相关题目，可直接作答或切换其他思想训练。\n\n如需更多变式，请关注后续更新。`);
}

/* ============ 工具栏事件 ============ */
function bindToolbar(){
  document.getElementById('btnTimer').addEventListener('click', toggleTimer);
  document.getElementById('btnReport').addEventListener('click', showReport);
  document.getElementById('btnFeat').addEventListener('click', () => document.getElementById('featModal').classList.add('show'));
  document.getElementById('btnRefresh').addEventListener('click', refreshSameKind);
  document.getElementById('btnNext').addEventListener('click', () => {
    const t = THOUGHTS[state.thoughtIdx];
    const qs = thoughtQuestions(t);
    if (state.qIdx < qs.length - 1) {
      state.qIdx++;
    } else if (state.thoughtIdx < THOUGHTS.length - 1) {
      state.thoughtIdx++;
      state.methodIdx = 0;
      state.qIdx = 0;
    } else {
      alert('🎉 已是最后一题！');
      return;
    }
    renderAll();
    window.scrollTo(0, 0);
  });
  document.querySelectorAll('[data-close]').forEach(el => {
    el.addEventListener('click', e => e.target.closest('.modal').classList.remove('show'));
  });
  document.querySelectorAll('.modal').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); });
  });
}

function init(){
  fillFeat();
  bindToolbar();
  renderAll();
}

document.addEventListener('DOMContentLoaded', init);

})();
</script>
</body>
</html>
