<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2ebd85">
<title>九年级上册 · 专题5</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#eefaf4,#eef4fb);
  min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px
}
.card{
  width:100%;max-width:420px;
  background:#fff;border-radius:20px;
  box-shadow:0 10px 30px rgba(47,157,240,.12);
  padding:52px 30px 44px;text-align:center
}
.badge{
  display:inline-block;
  background:linear-gradient(135deg,#35d29a,#2f9df0);
  color:#fff;border-radius:999px;
  padding:7px 18px;font-size:14px;font-weight:600;letter-spacing:1px
}
h1{font-size:22px;color:#33434b;margin:22px 0 14px}
.tip{font-size:15px;color:#8aa09a;letter-spacing:1px}
.back{
  display:inline-block;margin-top:30px;
  padding:12px 28px;border-radius:14px;
  background:linear-gradient(135deg,#35d29a,#2f9df0);
  color:#fff;text-decoration:none;font-size:14px;font-weight:600;
  transition:transform .15s ease,box-shadow .2s;
}
.back:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(47,157,240,.28)}
.back:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
  <span class="badge">九年级上册 · 专题5</span>
  <h1>📝 专题 5</h1>
  <p class="tip">🔨 内容开发中，敬请期待…</p>
  <a class="back" href="index.html">← 返回专题导航</a>
</div>
</body>
</html>
