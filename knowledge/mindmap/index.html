<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=3.0">
<title>数学思维导图 · 人教版新课标</title>
<style>
:root{
  --b:#2f9df0; --g:#2ebd85; --t:#33434b; --l:#8aa09a;
  --border:#e1eeea; --card:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#eefaf4,#eef4fb);
  color:var(--t); font-size:15px;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
}
.wrap{width:100%;max-width:800px; padding:14px 14px 0; flex:1}

/* ====== 页头 ====== */
.hdr{
  position:relative;
  background:linear-gradient(135deg,#35d29a,#2f9df0);
  border-radius:20px; padding:22px 18px 20px;
  text-align:center; color:#fff; overflow:hidden;
  box-shadow:0 14px 30px rgba(47,157,240,.25); margin-bottom:10px;
}
.hdr::before,.hdr::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hdr::before{width:120px;height:120px;top:-40px;right:-30px}
.hdr::after{width:70px;height:70px;bottom:-24px;left:-16px}
.hdr h1{position:relative;font-size:21px;letter-spacing:1.5px;font-weight:700}
.hdr .sub{position:relative;margin-top:8px;font-size:13px;opacity:.95; line-height:1.5}

/* ====== 学段 tab ====== */
.seg-bar{
  display:flex; gap:8px; margin-bottom:10px;
}
.seg-tab{
  flex:1; text-align:center; padding:10px 0;
  border-radius:14px; cursor:pointer; font-weight:700; font-size:14px;
  background:var(--card); color:var(--t); border:1.5px solid var(--border);
  transition:all .2s;
}
.seg-tab.on{
  background:linear-gradient(135deg,#35d29a,#2f9df0);
  color:#fff; border-color:transparent;
}
.seg-tab:hover:not(.on){border-color:var(--b);color:var(--b)}

/* ====== 快捷导航 ====== */
.quick-bar{
  display:flex; gap:5px; overflow-x:auto; padding:0 0 8px;
  margin-bottom:8px;
}
.quick-bar::-webkit-scrollbar{display:none}
.quick-chip{
  flex:0 0 auto; padding:6px 12px; border-radius:999px;
  font-size:12px; font-weight:600; cursor:pointer;
  background:var(--card); color:var(--t); border:1.5px solid var(--border);
  transition:all .2s; white-space:nowrap;
}
.quick-chip:hover,.quick-chip.on{border-color:var(--b);color:var(--b);background:#eff6ff}

/* ====== 统计条 ====== */
.stats-bar{
  display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;
}
.stat-chip{
  font-size:11.5px; padding:4px 10px; border-radius:10px;
  background:var(--card); color:var(--l); border:1px solid var(--border);
}

/* ====== 分支组 ====== */
.mm-root{display:flex; flex-direction:column; gap:8px; padding:2px 0}
.branch-group{
  background:var(--card); border-radius:16px;
  box-shadow:0 4px 14px rgba(47,157,240,.06); overflow:hidden;
}
.branch-header{
  display:flex; align-items:center; gap:10px;
  padding:14px 16px; cursor:pointer; user-select:none;
  font-weight:700; font-size:15px; color:#fff;
  transition:filter .2s;
}
.branch-header:hover{filter:brightness(1.05)}
.branch-header .bh-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.55);flex-shrink:0}
.branch-header .bh-arw{margin-left:auto;font-size:11px;opacity:.7;transition:transform .25s}
.branch-group.open .bh-arw{transform:rotate(180deg)}
.branch-body{max-height:0;overflow:hidden;transition:max-height .4s}
.branch-group.open .branch-body{max-height:8000px}

/* ====== 二级主题卡 ====== */
.topic-card{padding:12px 16px; border-top:1px solid #f0f5f3}
.topic-header{
  display:flex; align-items:center; gap:8px;
  font-weight:700; font-size:13.5px; color:var(--t);
  cursor:pointer; padding:2px 0; transition:color .15s;
}
.topic-header:hover{color:var(--b)}
.topic-header .th-icon{font-size:16px}
.topic-header .th-arw{color:var(--l);font-size:10px;transition:transform .25s}
.topic-card.open .th-arw{transform:rotate(180deg)}
.topic-detail{max-height:0;overflow:hidden;transition:max-height .35s}
.topic-card.open .topic-detail{max-height:3000px;padding-top:10px}

/* ====== 知识点行 ====== */
.kp-row{
  display:flex; align-items:flex-start; gap:8px; padding:4px 0 4px 24px;
  font-size:13px; line-height:1.65; position:relative;
}
.kp-row::before{
  content:""; position:absolute; left:10px; top:12px;
  width:5px; height:5px; border-radius:50%; background:var(--l);
}
.kp-grade{
  flex-shrink:0; font-size:10px; font-weight:700;
  padding:1px 6px; border-radius:5px; min-width:28px; text-align:center;
  margin-top:1px;
}
.kp-text{flex:1; color:var(--t)}

/* 年级色标 */
.g7{background:#e0f2fe;color:#0369a1}
.g8{background:#ede9fe;color:#6d28d9}
.g9{background:#fce4ec;color:#c62828}
.g79{background:#e0f2fe;color:#0369a1}

/* ====== 页脚 ====== */
.bt-home{
  display:block; width:fit-content;
  margin:20px auto 8px; padding:11px 26px;
  background:linear-gradient(135deg,#35d29a,#2f9df0);
  color:#fff; border:none; border-radius:999px;
  font-size:14px; font-weight:600; cursor:pointer;
  text-decoration:none;
  box-shadow:0 4px 14px rgba(47,157,240,.22);
  transition:transform .15s, box-shadow .25s;
}
.bt-home:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(47,157,240,.32)}
.bt-home:active{transform:scale(.97)}
.site-footer{
  text-align:center; padding:12px 0 22px;
  color:var(--l); font-size:.78rem;
  border-top:1px solid var(--border); margin-top:6px; width:100%;
}

@media(max-width:400px){
  .hdr h1{font-size:17px}
  .branch-header{font-size:14px;padding:12px 14px}
  .topic-card{padding:10px 12px}
  .kp-row{padding:4px 0 4px 20px;font-size:12px}
}
</style>
</head>

function gradeClass(n){ var m = {7:'g7',8:'g8',9:'g9'}; return m[n] || 'g7'; }

let currentSeg = 'primary';

function renderAll(){
  const segBar = document.getElementById('segBar');
  const qBar = document.getElementById('quickBar');
  const sBar = document.getElementById('statsBar');
  const root = document.getElementById('mmRoot');

  // 学段 tab
  segBar.innerHTML = '<div class="seg-tab'+(currentSeg==='primary'?' on':'')+'" onclick="switchSeg(\'primary\')">🎒 小学 1~6年级</div>'+
    '<div class="seg-tab'+(currentSeg==='middle'?' on':'')+'" onclick="switchSeg(\'middle\')">✏️ 初中 7~9年级</div>';

  const branches = DATA[currentSeg];
  let totalTopics = 0, totalItems = 0;
  let branchHTML = '';
  let quickHTML = '<span class="quick-chip on" data-id="all" onclick="scrollToBranch(\'all\')">📋 全部</span>';

  branches.forEach(b => {
    let tcHTML = '';
    b.topics.forEach(t => {
      let itemsHTML = t.items.map(it => {
        totalItems++;
        var gc = currentSeg==='primary' ? ('g'+it.grade) : gradeClass(it.grade);
        return '<div class="kp-row"><span class="kp-grade '+gc+'">'+it.grade+'年级</span><span class="kp-text">'+it.text+'</span></div>';
      }).join('');
      totalTopics++;
      tcHTML += '<div class="topic-card" id="topic-'+t.id+'">'+
        '<div class="topic-header" onclick="toggleTopic(this.parentElement)"><span class="th-icon">'+t.icon+'</span>'+t.name+
        '<span style="font-size:11px;color:var(--l);font-weight:400;margin-left:4px">'+t.items.length+'条</span>'+
        '<span class="th-arw">▾</span></div>'+
        '<div class="topic-detail">'+itemsHTML+'</div></div>';
    });

    branchHTML += '<div class="branch-group open" id="branch-'+b.id+'">'+
      '<div class="branch-header" style="background:linear-gradient(135deg,'+b.color+',#35d29a)" onclick="toggleBranch(this.parentElement)">'+
      '<span class="bh-dot"></span><span>'+b.icon+' '+b.name+'</span>'+
      '<span style="font-size:11px;opacity:.8;font-weight:400">'+b.topics.length+'主题 · '+b.topics.reduce((s,t)=>s+t.items.length,0)+'点</span>'+
      '<span class="bh-arw">▼</span></div>'+
      '<div class="branch-body">'+tcHTML+'</div></div>';

    quickHTML += '<span class="quick-chip" data-id="'+b.id+'" onclick="scrollToBranch(\''+b.id+'\')">'+b.icon+' '+b.name+'</span>';
  });

  root.innerHTML = branchHTML;
  qBar.innerHTML = quickHTML;
  var segLabel = currentSeg==='primary'?'小学1~6年级':'初中7~9年级';
  sBar.innerHTML = '<span class="stat-chip">📚 '+branches.length+' 大领域</span><span class="stat-chip">📌 '+totalTopics+' 主题</span><span class="stat-chip">⭐ '+totalItems+' 知识点</span><span class="stat-chip">🎓 '+segLabel+'全覆盖</span>';
}

function switchSeg(seg){
  currentSeg = seg;
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}
function toggleBranch(el){ el.classList.toggle('open'); }
function toggleTopic(el){ el.classList.toggle('open'); }

function scrollToBranch(id){
  document.querySelectorAll('.quick-chip').forEach(c=>c.classList.remove('on'));
  if(id==='all'){window.scrollTo({top:0,behavior:'smooth'});document.querySelector('.quick-chip[data-id="all"]').classList.add('on');return;}
  document.querySelector('.quick-chip[data-id="'+id+'"]').classList.add('on');
  var el=document.getElementById('branch-'+id);
  if(el){el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'start'});}
}

renderAll();
window.switchSeg = switchSeg;
window.scrollToBranch = scrollToBranch;
window.toggleBranch = toggleBranch;
window.toggleTopic = toggleTopic;
})();
</script>
